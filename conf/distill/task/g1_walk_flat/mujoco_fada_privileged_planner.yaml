# @package _global_
defaults:
  - /task/g1_walk_flat/mujoco_fada_privileged_idm
  - _self_

env:
  # Keep 64 rollout environments while serializing native MuJoCo stepping.
  mujoco_num_threads: 1

training:
  fada:
    training_schedule: alternating_idm_then_planner
    idm_updates: 128
    planner_updates: 128
    async_artifact_dir: logs/fada/planner_idm_privileged_v022/source_batches
    checkpoint_path: logs/fada/planner_idm_privileged_v022.pt
