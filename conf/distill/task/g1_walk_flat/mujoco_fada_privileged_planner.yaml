# @package _global_
defaults:
  - /task/g1_walk_flat/mujoco_fada_privileged_idm
  - _self_

env:
  # Keep 64 rollout environments while serializing native MuJoCo stepping.
  mujoco_num_threads: 1

training:
  fada:
    training_schedule: alternating_idm_then_planner
    idm_updates: 128
    planner_updates: 128
    async_artifact_dir: logs/fada/planner_idm_privileged_v022/source_batches
    checkpoint_path: logs/fada/planner_idm_privileged_v022.pt

# Playback is a nominal evaluation owner. Training continues to inherit the
# grouped-DR environment above; this profile is applied only when
# training.play_only=true.
play_profile:
  enabled: true
  env:
    commands:
      rel_standing_envs: 1.0
      rel_transition_envs: 0.0
      resampling_time: 0.0
      heading_command: false
      random_height_during_walking: false
    reset_base_qvel_limit: 0.0
    standing_reset_base_qvel_limit: 0.0
    curriculum:
      enabled: false
    noise_config:
      level: 0.0
    domain_rand:
      randomize_reset_pose: false
      actuator_strength:
        enabled: false
      randomize_kp: false
      randomize_kd: false
      randomize_ground_friction: false
      randomize_base_mass: false
      randomize_body_mass: false
      random_com: false
      randomize_gravity: false
      randomize_dof_armature: false
      randomize_dof_position_bias: false
      randomize_control_delay: false
      torque_rfi_fraction: 0.0
      push_robots: false
