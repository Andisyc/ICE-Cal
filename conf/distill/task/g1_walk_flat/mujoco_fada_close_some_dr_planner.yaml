# @package _global_
defaults:
  - /task/g1_walk_flat/mujoco_fada_privileged_planner
  - _self_

# Frozen collector semantics for the Oracle lineage in
# /ssd1/cyx/ICE-Cal/logs/close_some_dr.
training:
  fada:
    source_behavior_profile: configured_gait
    async_artifact_dir: logs/fada/planner_idm_close_some_dr_v001/source_batches
    checkpoint_path: logs/fada/planner_idm_close_some_dr_v001.pt

teacher:
  task: sac/g1_walk_flat/mujoco_fada_fixed_contact
  behavior_profile: configured_gait

env:
  gait_phase_enabled: true
  gait_phase_init_mode: offset_phase
  gait_clock_mode: continuous
  commands:
    dead_zone_enabled: false
    dead_zone_xy: 0.1
    dead_zone_yaw: 0.1
    small_xy_threshold: 0.4
    rel_standing_envs: 0.3
    rel_transition_envs: 0.0
    resampling_time: 0.0
    heading_command: false
  domain_rand:
    randomize_reset_pose: true
    randomize_kp: true
    randomize_kd: true
    randomize_ground_friction: true
    randomize_base_mass: true
    randomize_body_mass: false
    random_com: false
    randomize_dof_position_bias: false
    randomize_control_delay: false
    push_robots: false
    actuator_strength:
      enabled: false
      curriculum_enabled: false
      group_curriculum_enabled: true
      curriculum_progress_mode: episode_quality

reward:
  feet_phase_mode: absolute_phase_height
  gait_frequency: 1.5
  min_planar_command_speed_for_gait_reward: 0.4
  feet_phase_swing_height: 0.04
  feet_phase_tracking_sigma: 0.008
  scales:
    feet_phase: 5.0
    phase_contact: 0.0
    under_speed: -1.0
