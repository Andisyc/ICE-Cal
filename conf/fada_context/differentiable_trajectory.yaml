checkpoint_path: ../planner_idm_v005.pt
task_config: sac/g1_walk_flat/mujoco_left_knee_090
device: cuda:0
seed: 17

collection:
  num_envs: 64
  num_samples: 512
  reference_horizon: 6
  max_reset_batches: 64
  artifact_path: artifacts/fada_context/context_training_dataset.pt

context:
  hidden_dim: 128
  num_layers: 2
  residual_scale: 0.1
  learning_rate: 3.0e-4
  latent_weight: 1.0e-3
  action_smoothness_weight: 1.0e-3
  uncertainty_weight: 1.0e-3

dynamics:
  hidden_dims: [256, 256]
  ensemble_size: 5
  learning_rate: 3.0e-4
  rollout_horizon: 3
  multi_step_weight: 1.0

training:
  batch_size: 64
  validation_fraction: 0.2
  dynamics_steps: 10000
  context_steps: 10000
  log_interval: 25
  checkpoint_interval: 500
  gradient_clip_norm: 1.0
  output_dir: artifacts/fada_context/run_001
