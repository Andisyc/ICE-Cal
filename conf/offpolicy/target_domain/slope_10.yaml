# @package _global_
defaults:
  - /task: sac/g1_walk_flat/mujoco_fada_target_phase_locomotion
  - _self_

target_domain:
  target_domain_id: g1_slope_10_mujoco
  kind: slope
  task: sac/g1_walk_flat/mujoco_fada_target_phase_locomotion
  task_name: G1WalkFlat
  backend: mujoco
  dynamics_evaluation_scene_model_file: src/unilab/assets/robots/g1/scene_slope_10_wide.xml
  command_sampling:
    forward_speed_range: [0.75, 0.85]
    num_trials: 64
    seed: 1
  slope:
    angle_deg: 10.0
    width_m: 0.8
    approach_length_m: 1.5
    surface_length_m: 8.0
    entry_margin_m: 0.25
    finish_margin_m: 0.5

env:
  scene:
    model_file: src/unilab/assets/robots/g1/scene_slope_10.xml
  commands:
    vel_limit: [[0.85, 0.0, 0.0], [0.85, 0.0, 0.0]]
  noise_config:
    level: 0.0
  control_config:
    simulate_action_latency: false
  domain_rand:
    randomize_reset_pose: false
    randomize_base_mass: false
    randomize_body_mass: false
    random_com: false
    randomize_gravity: false
    randomize_ground_friction: false
    randomize_dof_armature: false
    push_robots: false
    randomize_kp: false
    randomize_kd: false
    randomize_dof_position_bias: false
    randomize_control_delay: false
    torque_rfi_fraction: 0.0
    actuator_strength:
      enabled: false
      multipliers: []
