defaults:
  - _self_
  - algo: sac
  - target_domain: slope_15
  - evaluation: fada_slope

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      handlers: [console]
