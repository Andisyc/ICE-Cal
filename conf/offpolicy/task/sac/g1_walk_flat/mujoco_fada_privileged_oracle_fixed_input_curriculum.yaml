# @package _global_
defaults:
  - /task/sac/g1_walk_flat/mujoco_fada_privileged_oracle
  - _self_

# Diagnostic only: preserve the privileged Actor architecture while removing
# privileged-value and actuator-fault variation, then restore penalty curriculum.
algo:
  privileged_input_diagnostic: true
  max_iterations: 500
  # Diagnostic checkpoints do not satisfy the sealed 5000-iteration Oracle lineage.
  save_interval: 0
  actor:
    fixed_privileged_input: true

env:
  curriculum:
    enabled: true
    initial_scale: 0.5
    min_scale: 0.5
    max_scale: 1.0
    level_down_threshold: 150.0
    level_up_threshold: 750.0
    degree: 0.001
  domain_rand:
    actuator_strength:
      enabled: false
