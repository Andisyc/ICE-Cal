# @package _global_
defaults:
  - /task/sac/g1_walk_flat/mujoco_fada_source
  - _self_

# Fixed-contact repair: penalty curriculum, low-speed starts, stance-only foot pose.
algo:
  actor:
    oracle_behavior_profile: fixed_phase_contact_v2

env:
  gait_phase_enabled: true
  gait_phase_init_mode: offset_phase
  commands:
    dead_zone_enabled: false
    resampling_time: 4.0
    # Keep 30% standing, add 30% low-speed straight walking; 40% stays unrestricted.
    rel_transition_envs: 0.3
    transition_vel_limit: [[0.05, 0.0, 0.0], [0.25, 0.0, 0.0]]
  command_gated_phase_contact:
    enabled: false
    # Only these static contact parameters are consumed; no command state machine.
    duty_factor: 0.55
    contact_force_threshold: 1.0

reward:
  feet_phase_mode: fixed_phase_contact_v2
  gait_frequency: 1.5
  scales:
    # v2 returns a positive cost so the existing penalty curriculum owns its scale.
    phase_contact: -1.0
    # Existing normalized forward underspeed cost; no change to tracking_sigma.
    under_speed: -1.0
    null_foot_force_balance: 0.0
    null_torque_relaxation: 0.0
