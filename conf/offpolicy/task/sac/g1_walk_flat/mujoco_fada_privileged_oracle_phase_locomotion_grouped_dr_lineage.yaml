# @package _global_
defaults:
  - /task/sac/g1_walk_flat/mujoco_fada_privileged_oracle_grouped_dr_lineage
  - _self_

# Dedicated FADA source policy for locomotion. It intentionally excludes the
# v022 standing mixture and reuses UniLab's mature G1 phase reward settings.
algo:
  actor:
    oracle_behavior_profile: phase_locomotion_v1

env:
  gait_phase_enabled: true
  gait_phase_init_mode: offset_phase
  commands:
    rel_standing_envs: 0.0

reward:
  scales:
    feet_phase: 5.0
    feet_phase_contrast: 0.0
    feet_phase_contact: 0.0
  gait_frequency: 1.5
  feet_phase_swing_height: 0.09
  feet_phase_tracking_sigma: 0.04

play_profile:
  env:
    commands:
      vel_limit: [[0.8, 0.0, 0.0], [0.8, 0.0, 0.0]]
      rel_standing_envs: 0.0
