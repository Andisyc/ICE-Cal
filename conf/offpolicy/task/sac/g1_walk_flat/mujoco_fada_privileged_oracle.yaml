# @package _global_
defaults:
  - /task/sac/g1_walk_flat/mujoco_no_gait_single_reward
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mujoco

algo:
  runtime_impl: privileged_locomotion_sac
  runtime_resolver: unilab.algos.torch.distill.fada_privileged_oracle_sac:resolve_privileged_locomotion_sac_runtime
  num_envs: 2048
  learning_starts: 10
  max_iterations: 5000
  save_interval: 240
  updates_per_step: 8
  use_symmetry: false
  gamma: 0.99
  value_support_min: -30.0
  value_support_max: 30.0
  obs_normalization: true
  actor:
    oracle_lineage_id: ${oc.env:ICE_CAL_ORACLE_LINEAGE_ID,REQUIRED}
    priv_info_embed_dim: 32
    priv_mlp_hidden_dims: [256, 128, 32]
    priv_info_normalization: true
  algo_params:
    alpha_init: 0.001
    target_entropy_ratio: 0.0

env:
  fada_privileged_observation:
    enabled: true
    schema: g1_fada_privileged_v1
  domain_rand:
    actuator_strength:
      enabled: true
      sampling_mode: single_candidate
      candidate_actuator_indices: [3]
      multiplier_range: [0.8, 1.0]
      nominal_probability: 0.3
      include_in_critic_obs: false

# Playback is nominal evaluation. Training keeps the targeted actuator-strength
# distribution above; BackendAdapter applies this profile only for play_only.
play_profile:
  enabled: true
  env:
    commands:
      rel_standing_envs: 1.0
      rel_transition_envs: 0.0
      resampling_time: 0.0
      heading_command: false
      random_height_during_walking: false
    reset_base_qvel_limit: 0.0
    standing_reset_base_qvel_limit: 0.0
    curriculum:
      enabled: false
    noise_config:
      level: 0.0
    domain_rand:
      randomize_reset_pose: false
      actuator_strength:
        enabled: false
      randomize_kp: false
      randomize_kd: false
      randomize_ground_friction: false
      randomize_base_mass: false
      randomize_body_mass: false
      random_com: false
      randomize_gravity: false
      randomize_dof_armature: false
      randomize_dof_position_bias: false
      randomize_control_delay: false
      torque_rfi_fraction: 0.0
      push_robots: false
