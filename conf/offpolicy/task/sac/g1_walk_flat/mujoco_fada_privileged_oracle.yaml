# @package _global_
defaults:
  - /task/sac/g1_walk_flat/mujoco_no_gait_single_reward
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mujoco

algo:
  runtime_impl: privileged_locomotion_sac
  runtime_resolver: unilab.algos.torch.distill.fada_privileged_oracle_sac:resolve_privileged_locomotion_sac_runtime
  num_envs: 2048
  learning_starts: 10
  max_iterations: 5000
  save_interval: 240
  updates_per_step: 8
  use_symmetry: false
  gamma: 0.99
  value_support_min: -30.0
  value_support_max: 30.0
  obs_normalization: true
  actor:
    oracle_lineage_id: ${oc.env:ICE_CAL_ORACLE_LINEAGE_ID,REQUIRED}
    priv_info_embed_dim: 32
    priv_mlp_hidden_dims: [256, 128, 32]
    priv_info_normalization: true
  algo_params:
    alpha_init: 0.001
    target_entropy_ratio: 0.0

env:
  fada_privileged_observation:
    enabled: true
    schema: g1_fada_privileged_v1
  domain_rand:
    actuator_strength:
      enabled: true
      sampling_mode: single_candidate
      candidate_actuator_indices: [3]
      multiplier_range: [0.8, 1.0]
      nominal_probability: 0.3
      include_in_critic_obs: false
