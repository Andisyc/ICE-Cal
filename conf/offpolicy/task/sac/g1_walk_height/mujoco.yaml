# @package _global_
defaults:
  - /task/sac/g1_walk_flat/mujoco
  - _self_
training:
  task_name: G1WalkHeight
  sim_backend: mujoco
env:
  commands:
    height_range: [0.2, 0.754]
    default_height: 0.754
    random_height_during_walking: true
    observe_height_command: true
reward:
  scales:
    track_base_height_exp_smooth: 4.0
  base_height_target: 0.754
