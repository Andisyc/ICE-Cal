<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniLab Architecture Atlas</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #5d6976;
      --paper: #fbfaf4;
      --panel: #fffdf6;
      --line: #d9d2c3;
      --font-body: "Avenir Next", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
      --font-display: "Avenir Next", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
      --font-code: "JetBrains Mono", "SF Mono", "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      letter-spacing: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: #fffef9;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
      font-family: var(--font-display);
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .zoom-label {
      min-width: 48px;
      text-align: center;
      color: #3f4b59;
      font-variant-numeric: tabular-nums;
    }

    button {
      border: 1px solid #b9b1a2;
      background: #fff7df;
      color: var(--ink);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }

    main {
      display: grid;
      grid-template-columns: minmax(360px, 0.32fr) minmax(760px, 1fr);
      height: calc(100vh - 54px);
      min-height: 620px;
      overflow: hidden;
    }

    main.editor-hidden {
      grid-template-columns: minmax(0, 1fr);
    }

    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    main.editor-hidden aside {
      display: none;
    }

    .hint {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    textarea {
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      resize: none;
      border: 0;
      outline: 0;
      padding: 14px;
      background: #fffdf8;
      color: #222;
      font-family: var(--font-code);
      font-size: 12px;
      line-height: 1.45;
      tab-size: 2;
    }

    .stage {
      position: relative;
      overflow: auto;
      min-width: 0;
      background:
        linear-gradient(rgba(31, 41, 51, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 41, 51, 0.025) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      cursor: grab;
      overscroll-behavior: contain;
    }

    .stage.dragging {
      cursor: grabbing;
      user-select: none;
    }

    svg {
      display: block;
      width: 1520px;
      height: 980px;
      transform-origin: 0 0;
    }

    .status {
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 1040px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      h1 {
        overflow-wrap: anywhere;
      }

      .toolbar {
        flex-wrap: wrap;
        white-space: normal;
      }

      main {
        grid-template-columns: 1fr;
        height: auto;
      }

      aside {
        height: 360px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <header>
  <h1 id="page-title">UniLab Architecture Atlas</h1>
    <div class="toolbar">
      <span class="status" id="status">loading</span>
      <button id="toggle-editor">Show Editor</button>
      <button id="zoom-out">-</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button id="zoom-in">+</button>
      <button id="zoom-fit">Fit Width</button>
      <button id="zoom-reset">100%</button>
      <button id="reload">Reload JSON</button>
      <button id="render">Render Editor</button>
    </div>
  </header>
  <main id="layout" class="editor-hidden">
    <aside>
      <div class="hint" id="hint"></div>
      <textarea id="source" spellcheck="false"></textarea>
    </aside>
    <section class="stage" id="stage">
    <svg id="diagram" viewBox="0 0 1520 980" role="img" aria-label="UniLab architecture atlas"></svg>
    </section>
  </main>
  <script type="module">
    import rough from "./node_modules/roughjs/bundled/rough.esm.js";

    const params = new URLSearchParams(window.location.search);
    const dataUrl = params.get("data") || "../../concept/03_g1_multiteacher_distillation_method.data.json";
    const source = document.getElementById("source");
    const status = document.getElementById("status");
    const svg = document.getElementById("diagram");
    const reloadButton = document.getElementById("reload");
    const renderButton = document.getElementById("render");
    const toggleEditorButton = document.getElementById("toggle-editor");
    const zoomOutButton = document.getElementById("zoom-out");
    const zoomInButton = document.getElementById("zoom-in");
    const zoomFitButton = document.getElementById("zoom-fit");
    const zoomResetButton = document.getElementById("zoom-reset");
    const zoomLabel = document.getElementById("zoom-label");
    const layout = document.getElementById("layout");
    const stage = document.getElementById("stage");
    const title = document.getElementById("page-title");
    const hint = document.getElementById("hint");
    let lastServerData = null;
    let sourceDirty = false;
    let canvasWidth = 1520;
    let canvasHeight = 980;
    let zoom = 1;
    let autoFitWidth = true;
    let activeInspectorCardId = null;
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let panScrollLeft = 0;
    let panScrollTop = 0;

    function setStatus(text) {
      status.textContent = text;
    }

    function clearSvg() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
    }

    function setCanvas(width, height) {
      canvasWidth = width;
      canvasHeight = height;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      applyZoom();
    }

    function clampZoom(value) {
      return Math.max(0.25, Math.min(2.8, value));
    }

    function applyZoom(anchor = null) {
      const oldWidth = Number.parseFloat(svg.style.width) || canvasWidth;
      const oldHeight = Number.parseFloat(svg.style.height) || canvasHeight;
      const nextWidth = canvasWidth * zoom;
      const nextHeight = canvasHeight * zoom;
      const centerX = anchor?.x ?? stage.scrollLeft + stage.clientWidth / 2;
      const centerY = anchor?.y ?? stage.scrollTop + stage.clientHeight / 2;
      const ratioX = oldWidth > 0 ? centerX / oldWidth : 0;
      const ratioY = oldHeight > 0 ? centerY / oldHeight : 0;
      svg.style.width = `${nextWidth}px`;
      svg.style.height = `${nextHeight}px`;
      zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
      requestAnimationFrame(() => {
        stage.scrollLeft = Math.max(0, nextWidth * ratioX - stage.clientWidth / 2);
        stage.scrollTop = Math.max(0, nextHeight * ratioY - stage.clientHeight / 2);
      });
    }

    function setZoom(nextZoom, options = {}) {
      if (!options.keepAutoFit) {
        autoFitWidth = false;
      }
      zoom = clampZoom(nextZoom);
      applyZoom();
    }

    function fitWidth() {
      autoFitWidth = true;
      const padding = 48;
      const available = Math.max(320, stage.clientWidth - padding);
      zoom = clampZoom(available / canvasWidth);
      applyZoom();
    }

    function addText(text, x, y, options = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "text");
      el.setAttribute("x", x);
      el.setAttribute("y", y);
      el.setAttribute("fill", options.fill || "#1f2933");
      el.setAttribute("font-size", options.size || 18);
      el.setAttribute("font-weight", options.weight || 500);
      const bodyFont = '"Avenir Next", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif';
      const displayFont = '"Avenir Next", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif';
      const codeFont = '"JetBrains Mono", "SF Mono", "SFMono-Regular", Menlo, Monaco, Consolas, monospace';
      el.setAttribute("font-family", options.family || (options.code ? codeFont : (options.display || (options.weight || 500) >= 650 ? displayFont : bodyFont)));
      el.setAttribute("letter-spacing", "0");
      if (options.anchor) el.setAttribute("text-anchor", options.anchor);
      el.textContent = text;
      svg.appendChild(el);
      return el;
    }

    function textUnits(text) {
      return Array.from(String(text || "")).reduce((sum, ch) => (
        sum + (/[\u3400-\u9fff\uff00-\uffef]/.test(ch) ? 1.85 : 1)
      ), 0);
    }

    function splitLongWord(word, maxUnits) {
      if (textUnits(word) <= maxUnits) return [word];
      const chunks = [];
      let chunk = "";
      for (const ch of Array.from(word)) {
        if (chunk && textUnits(chunk + ch) > maxUnits) {
          chunks.push(chunk);
          chunk = ch;
        } else {
          chunk += ch;
        }
      }
      if (chunk) chunks.push(chunk);
      return chunks;
    }

    function wrappedLines(text, width, options = {}) {
      const charWidth = options.charWidth || 7;
      const maxUnits = Math.max(8, Math.floor(width / charWidth));
      const tokens = String(text || "")
        .replace(/\s+/g, " ")
        .trim()
        .split(" ")
        .flatMap((word) => splitLongWord(word, maxUnits));
      const lines = [];
      let line = "";
      for (const token of tokens) {
        const needsSpace = line && /[A-Za-z0-9)]$/.test(line) && /^[A-Za-z0-9(]/.test(token);
        const probe = line ? `${line}${needsSpace ? " " : ""}${token}` : token;
        if (textUnits(probe) > maxUnits && line) {
          lines.push(line);
          line = token;
        } else {
          line = probe;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function measuredLineCount(text, width, options = {}) {
      const lines = wrappedLines(text, width, options);
      if (!lines.length) return 1;
      return options.maxLines ? Math.min(lines.length, options.maxLines) : lines.length;
    }

    function estimatedTextWidth(text, options = {}) {
      return textUnits(text) * (options.charWidth || 7);
    }

    function wrapText(text, x, y, width, options = {}) {
      const lines = wrappedLines(text, width, options);
      const rendered = lines.slice(0, options.maxLines || lines.length);
      rendered.forEach((ln, idx) => {
        addText(ln, x, y + idx * (options.lineHeight || 18), {
          size: options.size || 13,
          fill: options.fill || "#364250",
          weight: options.weight || 500,
          code: options.code,
          display: options.display,
          family: options.family,
        });
      });
      return rendered.length;
    }

    function wrapMultilineText(text, x, y, width, options = {}) {
      const maxLines = options.maxLines || Number.POSITIVE_INFINITY;
      const lineHeight = options.lineHeight || 18;
      let count = 0;
      for (const paragraph of String(text || "").split("\n")) {
        const lines = wrappedLines(paragraph, width, options);
        for (const line of lines) {
          if (count >= maxLines) return count;
          addText(line, x, y + count * lineHeight, {
            size: options.size || 13,
            fill: options.fill || "#364250",
            weight: options.weight || 500,
            code: options.code,
            display: options.display,
            family: options.family,
          });
          count += 1;
        }
      }
      return count;
    }

    function colorWithAlpha(hex, alpha) {
      const clean = String(hex || "#6688aa").replace("#", "");
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function conceptColor(data, concept, fallback = "#6688aa") {
      return data.concepts?.[concept]?.color || data.palette?.[concept] || fallback;
    }

    function drawCard(rc, x, y, w, h, color, options = {}) {
      svg.appendChild(rc.rectangle(x, y, w, h, {
        stroke: options.stroke || "#1f2933",
        strokeWidth: options.strokeWidth || 1.4,
        roughness: options.roughness || 1.35,
        bowing: options.bowing || 1.05,
        fill: options.fill || colorWithAlpha(color, 0.13),
        fillStyle: options.fillStyle || "solid",
        hachureGap: 8,
      }));
    }

    function drawHeader(data, subtitle, width = 1520) {
      const rc = rough.svg(svg);
      const title = data.title || "Architecture Map";
      const subtitleText = subtitle || data.subtitle || "";
      const textWidth = width - 140;
      const titleLines = measuredLineCount(title, textWidth, { charWidth: 15.5 });
      const subtitleLines = measuredLineCount(subtitleText, textWidth, { charWidth: 7.2 });
      const headerHeight = Math.max(92, 50 + titleLines * 34 + subtitleLines * 18);
      svg.appendChild(rc.rectangle(28, 26, width - 56, headerHeight, {
        stroke: "#d8cdb8",
        strokeWidth: 1.2,
        roughness: 0.9,
        bowing: 0.6,
        fill: "rgba(255,255,255,0.35)",
        fillStyle: "solid",
      }));
      wrapText(title, 70, 73, textWidth, {
        size: 32,
        lineHeight: 34,
        charWidth: 15.5,
        weight: 800,
      });
      wrapText(subtitleText, 74, 102 + Math.max(0, titleLines - 1) * 34, textWidth, {
        size: 15,
        lineHeight: 18,
        charWidth: 7.2,
        fill: "#5d6976",
        weight: 500,
      });
      rc.headerBottom = 26 + headerHeight;
      return rc;
    }

    function drawLegend(data, x, y) {
      if (data.showLegend === false) return;
      const entries = Object.entries(data.concepts || {});
      if (!entries.length) return;
      const rc = rough.svg(svg);
      addText("概念颜色", x, y, { size: 14, fill: "#5d6976", weight: 800 });
      entries.forEach(([id, concept], idx) => {
        const yy = y + 24 + idx * 24;
        const color = concept.color || "#6688aa";
        svg.appendChild(rc.rectangle(x, yy - 12, 16, 14, {
          stroke: color,
          fill: colorWithAlpha(color, 0.55),
          fillStyle: "solid",
          roughness: 1.1,
        }));
        addText(`${id}  ${concept.name}`, x + 25, yy, { size: 12, fill: "#495463", weight: 600 });
      });
    }

    function renderTabs(data) {
      const width = 1480;
      const height = 1080;
      setCanvas(width, height);
      const rc = drawHeader(data, data.subtitle || "按列阅读：真实问题 -> 概念变量 -> 工程承载。颜色和 ID 与其他图保持一致。", width);
      const cols = [
        { x: 70, y: 150, w: 380 },
        { x: 550, y: 150, w: 380 },
        { x: 1030, y: 150, w: 380 },
      ];

      (data.tabs || []).forEach((tab, idx) => {
        const col = cols[idx] || cols[cols.length - 1];
        const tabColor = tab.color || "#6688aa";
        const cards = tab.cards || [];
        const cardW = col.w - 74;
        const cardGap = 24;
        const cardHeights = cards.map((card) => {
          const titleLines = measuredLineCount(`${card.id}  ${card.title}`, cardW - 36, {
            charWidth: 7.6,
          });
          const bodyLines = measuredLineCount(card.body || "", cardW - 36, {
            charWidth: 6.4,
          });
          return Math.max(92, 38 + titleLines * 18 + bodyLines * 15);
        });
        const tabHeight = Math.max(760, 80 + cardHeights.reduce((sum, h) => sum + h + cardGap, 0));
        drawCard(rc, col.x, col.y, col.w, tabHeight, tabColor, {
          stroke: tabColor,
          strokeWidth: 2.4,
          roughness: 1.8,
          bowing: 1.2,
          fill: colorWithAlpha(tabColor, 0.08),
          fillStyle: "hachure",
        });
        drawCard(rc, col.x + 18, col.y - 36, 240, 52, tabColor, {
          stroke: tabColor,
          strokeWidth: 2.3,
          fill: colorWithAlpha(tabColor, 0.2),
        });
        addText(`${tab.id}  ${tab.title}`, col.x + 34, col.y - 5, { size: 20, weight: 800 });

        if (cards.length) {
          const spineX = col.x + 24;
          const firstCenterY = col.y + 44 + cardHeights[0] / 2;
          let lastCenterY = firstCenterY;
          for (let i = 0, yy = col.y + 44; i < cards.length; i += 1) {
            lastCenterY = yy + cardHeights[i] / 2;
            yy += cardHeights[i] + cardGap;
          }
          svg.appendChild(rc.line(spineX, firstCenterY, spineX, lastCenterY, {
            stroke: tabColor,
            strokeWidth: 2.1,
            roughness: 1.2,
          }));
        }

        let cardYCursor = col.y + 44;
        cards.forEach((card, cardIdx) => {
          const cardX = col.x + 46;
          const cardY = cardYCursor;
          const cardH = cardHeights[cardIdx];
          const centerY = cardY + cardH / 2;
          const spineX = col.x + 24;
          svg.appendChild(rc.line(spineX, centerY, cardX - 10, centerY, {
            stroke: tabColor,
            strokeWidth: 1.9,
            roughness: 1.1,
          }));
          svg.appendChild(rc.circle(spineX, centerY, 10, {
            stroke: tabColor,
            fill: colorWithAlpha(tabColor, 0.75),
            fillStyle: "solid",
            strokeWidth: 1,
          }));
          drawCard(rc, cardX, cardY, cardW, cardH, tabColor);
          const titleLines = wrapText(`${card.id}  ${card.title}`, cardX + 18, cardY + 27, cardW - 36, {
            size: 16,
            lineHeight: 18,
            charWidth: 7.6,
            weight: 800,
            fill: "#26313d",
          });
          wrapText(card.body || "", cardX + 18, cardY + 50 + Math.max(0, titleLines - 1) * 18, cardW - 36, {
            size: 12,
            lineHeight: 15,
            charWidth: 6.4,
            fill: "#495463",
          });
          cardYCursor += cardH + cardGap;
        });
      });
      addText("无跨框曲线：靠列顺序、颜色和编号对应概念关系，避免线条穿过内容。", 76, height - 52, {
        size: 14,
        fill: "#6f7b86",
        weight: 700,
      });
    }

    function renderInspector(data) {
      const cards = Array.isArray(data.cards) ? data.cards : [];
      const steps = Array.isArray(data.transaction?.steps) ? data.transaction.steps : [];
      const width = 1680;
      const left = 44;
      const contentWidth = width - left * 2;
      const rc = rough.svg(svg);
      if (!cards.length || !steps.length) {
        setCanvas(width, 1040);
        drawHeader(data, data.subtitle, width);
        addText("Design Inspector 数据为空", left, 188, { size: 20, weight: 720, fill: "#9b3f32" });
        return;
      }

      if (!activeInspectorCardId || !cards.some((card) => card.designId === activeInspectorCardId)) {
        activeInspectorCardId = cards[0].designId;
      }
      const activeCard = cards.find((card) => card.designId === activeInspectorCardId) || cards[0];
      const highlightSteps = new Set(activeCard.highlightSteps || []);
      const activeColor = activeCard.color || "#64748b";

      const selectorTop = 130;
      const selectorColumns = 5;
      const selectorRows = Math.ceil(cards.length / selectorColumns);
      const selectorGap = 14;
      const selectorWidth = (contentWidth - selectorGap * (selectorColumns - 1)) / selectorColumns;
      const selectorHeight = 68;
      const transactionTop = selectorTop + selectorRows * (selectorHeight + 12) + 24;
      const detailTop = transactionTop + 360;
      const detailRows = Array.isArray(activeCard.details) ? activeCard.details : [];
      const detailTextWidth = Math.min(contentWidth - 88, 1160);
      const detailHeaderHeight = activeCard.responsibility ? 104 : 64;
      const detailRowHeightFor = (detail) => {
        const row = typeof detail === "string" ? { text: detail } : detail;
        const headingHeight = row?.heading ? 27 : 0;
        const textLines = measuredLineCount(row?.text || "", detailTextWidth, { charWidth: 7.4 });
        return 34 + headingHeight + Math.max(1, textLines) * 20;
      };
      const detailHeight = detailHeaderHeight + detailRows.reduce(
        (sum, detail) => sum + detailRowHeightFor(detail),
        0,
      );
      const height = Math.max(1040, detailTop + detailHeight + 54);

      setCanvas(width, height);
      drawHeader(data, data.subtitle, width);

      cards.forEach((card, index) => {
        const column = index % selectorColumns;
        const row = Math.floor(index / selectorColumns);
        const x = left + column * (selectorWidth + selectorGap);
        const y = selectorTop + row * (selectorHeight + 12);
        const selected = card.designId === activeCard.designId;
        const color = card.color || "#64748b";
        drawCard(rc, x, y, selectorWidth, selectorHeight, color, {
          stroke: selected ? color : colorWithAlpha(color, 0.5),
          strokeWidth: selected ? 2.3 : 0.9,
          roughness: selected ? 1.0 : 0.45,
          bowing: 0.3,
          fill: selected ? colorWithAlpha(color, 0.18) : "rgba(255,255,255,0.68)",
        });
        addText(`${card.designId} / ${card.blockId}`, x + 13, y + 20, {
          size: 10.8, weight: 700, code: true, fill: color,
        });
        wrapText(card.title, x + 13, y + 44, selectorWidth - 26, {
          size: 16.5, lineHeight: 19, charWidth: 8.0, maxLines: 1, weight: 760, fill: "#26313d",
        });

        const hit = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        hit.setAttribute("x", x);
        hit.setAttribute("y", y);
        hit.setAttribute("width", selectorWidth);
        hit.setAttribute("height", selectorHeight);
        hit.setAttribute("fill", "transparent");
        hit.setAttribute("pointer-events", "all");
        hit.setAttribute("role", "button");
        hit.setAttribute("tabindex", "0");
        hit.setAttribute("aria-label", `查看 ${card.title} 的设计细节`);
        hit.style.cursor = "pointer";
        const selectCard = (event) => {
          event.preventDefault();
          event.stopPropagation();
          activeInspectorCardId = card.designId;
          render(data);
        };
        hit.addEventListener("mousedown", (event) => event.stopPropagation());
        hit.addEventListener("click", selectCard);
        hit.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") selectCard(event);
        });
        svg.appendChild(hit);
      });

      const phaseTitles = data.transaction?.phaseTitles || {};
      const phaseDefinitions = [
        { id: "pre", title: phaseTitles.pre || "进入训练", y: transactionTop },
        { id: "collection", title: phaseTitles.collection || "收集 Oracle 证据", y: transactionTop + 144 },
        { id: "update", title: phaseTitles.update || "蒸馏更新", y: transactionTop + 258 },
      ];
      const phaseLabelWidth = 126;
      const stepGap = 13;
      const stepHeight = 76;
      const drawPhase = (phase) => {
        const phaseSteps = steps.filter((step) => step.phase === phase.id);
        const startX = left + phaseLabelWidth;
        const availableWidth = contentWidth - phaseLabelWidth;
        const stepWidth = Math.min(248, (availableWidth - stepGap * Math.max(0, phaseSteps.length - 1)) / Math.max(1, phaseSteps.length));
        addText(phase.title, left, phase.y + 36, {
          size: 15, weight: 760, display: true, fill: "#485563",
        });
        phaseSteps.forEach((step, index) => {
          const globalIndex = steps.findIndex((item) => item.id === step.id) + 1;
          const x = startX + index * (stepWidth + stepGap);

    function flattenFlow(nodes, depth = 0, parent = null, rows = []) {
      for (const node of nodes || []) {
        rows.push({ node, depth, parent });
        flattenFlow(node.children || [], depth + 1, node.id, rows);
      }
      return rows;
    }

    function flowFieldsForNode(node) {
      const methodNode = node.problem || node.method || node.code || node.review;
      return (methodNode ? [
        ["问题", node.problem],
        ["方法", node.method],
        ["代码", node.code],
        ["审计", node.review],
        ["禁止", node.forbidden],
        ["证据", node.diagnostic],

        ["行号", node.lines],
        ["输入", node.input],
        ["职责", node.role],
        ["输出", node.output],
        ["禁止", node.forbidden],
        ["证据", node.diagnostic],
      ]).filter(([, value]) => value);
    }

    function methodAnchor(node, anchor) {
      const cx = node.x + node.w / 2;
      const cy = node.y + node.h / 2;
      if (anchor === "left") return [node.x, cy];
      if (anchor === "right") return [node.x + node.w, cy];
      if (anchor === "top") return [cx, node.y];
      if (anchor === "bottom") return [cx, node.y + node.h];
      return [cx, cy];
    }

    function methodEdgeAnchors(from, to, edge) {
      if (edge.fromAnchor || edge.toAnchor) {
        return [methodAnchor(from, edge.fromAnchor || "right"), methodAnchor(to, edge.toAnchor || "left")];
      }
      const dx = (to.x + to.w / 2) - (from.x + from.w / 2);
      const dy = (to.y + to.h / 2) - (from.y + from.h / 2);
      if (Math.abs(dx) >= Math.abs(dy)) {
        return [methodAnchor(from, dx >= 0 ? "right" : "left"), methodAnchor(to, dx >= 0 ? "left" : "right")];
      }
      return [methodAnchor(from, dy >= 0 ? "bottom" : "top"), methodAnchor(to, dy >= 0 ? "top" : "bottom")];
    }

    function methodLongestSegmentMidpoint(points) {
      let best = { length: -1, x: points[0][0], y: points[0][1] };
      for (let idx = 1; idx < points.length; idx += 1) {
        const a = points[idx - 1];
        const b = points[idx];
        const length = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (length > best.length) {
          best = { length, x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2 };
        }
      }
      return best;
    }

    function drawMethodArrowHead(points, color) {
      if (points.length < 2) return;
      const end = points[points.length - 1];
      const prev = points[points.length - 2];
      const angle = Math.atan2(end[1] - prev[1], end[0] - prev[0]);
      const size = 10;
      const wing = 5.5;
      const baseX = end[0] - Math.cos(angle) * size;
      const baseY = end[1] - Math.sin(angle) * size;
      const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      polygon.setAttribute("points", [
        `${end[0]},${end[1]}`,
        `${baseX + Math.sin(angle) * wing},${baseY - Math.cos(angle) * wing}`,
        `${baseX - Math.sin(angle) * wing},${baseY + Math.cos(angle) * wing}`,
      ].join(" "));
      polygon.setAttribute("fill", color);
      svg.appendChild(polygon);
    }

    function drawMethodNode(rc, data, node) {
      const color = conceptColor(data, node.concept, node.color || "#6688aa");
      const compact = node.h < 140;
      const shape = rc.rectangle(node.x, node.y, node.w, node.h, {
        stroke: color,
        strokeWidth: node.kind === "external" ? 1.4 : 1.8,
        strokeLineDash: node.kind === "external" ? [7, 5] : undefined,
        roughness: 1.05,
        bowing: 0.7,
        fill: colorWithAlpha(color, node.kind === "external" ? 0.025 : compact ? 0.08 : 0.12),
        fillStyle: "solid",
      });
      const tooltip = document.createElementNS("http://www.w3.org/2000/svg", "title");
      const codeRefs = (node.codeRefs || []).join("\n");
      tooltip.textContent = `${node.id} ${node.title}\n${node.summary || ""}${codeRefs ? `\n\nCode:\n${codeRefs}` : ""}`;
      shape.appendChild(tooltip);
      svg.appendChild(shape);

      const titleLines = wrapText(node.title, node.x + 16, node.y + 31, node.w - 32, {
        size: compact ? 16 : 17,
        lineHeight: 19,
        charWidth: 8,
        maxLines: 2,
        weight: 900,
        fill: "#27313d",
      });
      const summaryLineHeight = compact ? 16 : 17;
      const summaryY = node.y + 62 + Math.max(0, titleLines - 1) * 19;
      const summaryBottom = node.y + node.h - 14;
      const summaryMaxLines = Math.max(1, Math.floor((summaryBottom - summaryY) / summaryLineHeight));
      wrapText(node.summary || "", node.x + 16, summaryY, node.w - 32, {
        size: compact ? 12 : 13,
        lineHeight: summaryLineHeight,
        charWidth: compact ? 6.2 : 6.6,
        maxLines: summaryMaxLines,
        weight: 550,
        fill: "#4d5966",
      });
    }

    function renderMethodFigure(data) {
      const width = data.figureWidth || 1800;
      const height = data.figureHeight || 800;
      setCanvas(width, height);
      const rc = rough.svg(svg);
      const nodes = new Map((data.nodes || []).map((node) => [node.id, node]));

      const edgeLabels = [];
      (data.edges || []).forEach((edge) => {
        const from = nodes.get(edge.from);
        const to = nodes.get(edge.to);
        if (!from || !to) return;
        const [start, end] = methodEdgeAnchors(from, to, edge);
        const points = [start, ...(edge.via || []), end];
        const color = conceptColor(data, edge.concept || from.concept, "#667085");
        svg.appendChild(rc.linearPath(points, {
          stroke: color,
          strokeWidth: edge.kind === "feedback" ? 2.8 : 2.1,
          roughness: 0.9,
          bowing: 0.65,
          strokeLineDash: edge.kind === "evidence" ? [7, 5] : undefined,
        }));
        drawMethodArrowHead(points, color);
        if (edge.label) {
          const midpoint = methodLongestSegmentMidpoint(points);
          edgeLabels.push({
            ...midpoint,
            x: (edge.labelX ?? midpoint.x) + (edge.labelDx ?? 0),
            y: (edge.labelY ?? midpoint.y) + (edge.labelDy ?? -8),
            text: edge.label,
            color,
          });
        }
      });

      (data.nodes || []).forEach((node) => drawMethodNode(rc, data, node));

      edgeLabels.forEach((label) => {
        const text = addText(label.text, label.x, label.y, {
          size: 11,
          weight: 750,
          fill: label.color,
          anchor: "middle",
        });
        text.setAttribute("paint-order", "stroke");
        text.setAttribute("stroke", "#fffdf6");
        text.setAttribute("stroke-width", "5");
        text.setAttribute("stroke-linejoin", "round");
      });

    }

    function drawReadingBox(rc, x, y, w, h, color, titleText, bodyText = "", options = {}) {

    function drawReadingConnector(rc, from, to, color, dashed = false) {
      const start = [from.x + from.w, from.y + from.h / 2];
      const end = [to.x, to.y + to.h / 2];
      const midX = start[0] + Math.max(34, (end[0] - start[0]) * 0.48);
      svg.appendChild(rc.linearPath([start, [midX, start[1]], [midX, end[1]], end], {

        strokeWidth: 1.35,
        roughness: 0.72,
        bowing: 0.35,
        strokeLineDash: dashed ? [7, 6] : undefined,
      }));

    function readingList(items) {
      return (items || []).filter(Boolean).map((item, index) => `${index + 1}. ${item}`).join("\n");
    }

    function sourceHref(file) {
      if (!file || !file.path || !Number.isInteger(file.sourceLine) || file.sourceLine < 1) return null;
      return `/open-source?path=${encodeURIComponent(file.path)}&line=${file.sourceLine}`;
    }

    function addSourceTextLink(label, x, y, width, file) {
      const href = sourceHref(file);
      if (!href) {
        return addText(label, x, y, { size: 14, weight: 500, code: true, fill: "#3f4a55" });
      }
      const anchor = document.createElementNS("http://www.w3.org/2000/svg", "a");
      anchor.setAttribute("href", href);
      anchor.dataset.sourceLink = "true";
      const hitArea = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      hitArea.setAttribute("x", x - 4);
      hitArea.setAttribute("y", y - 18);
      hitArea.setAttribute("width", width);
      hitArea.setAttribute("height", 24);
      hitArea.setAttribute("fill", "transparent");
      hitArea.setAttribute("pointer-events", "all");
      hitArea.style.cursor = "pointer";
      const textEl = addText(label, x, y, { size: 14, weight: 500, code: true, fill: "#0b63b6" });
      svg.removeChild(textEl);
      const titleEl = document.createElementNS("http://www.w3.org/2000/svg", "title");
      titleEl.textContent = `打开源码 ${file.path}:${file.sourceLine}`;
      anchor.appendChild(titleEl);
      anchor.appendChild(hitArea);
      anchor.appendChild(textEl);
      anchor.addEventListener("mousedown", (event) => event.stopPropagation());
      anchor.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        setStatus(`opening ${file.path}:${file.sourceLine}`);
        fetch(href, { method: "POST" })
          .then((response) => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            setStatus(`opened ${file.path}:${file.sourceLine}`);
          })
          .catch((error) => setStatus(`source link failed: ${error.message}`));
      });
      svg.appendChild(anchor);
      return textEl;
    }

    function drawCenteredCluster(rc, x, y, w, items, color) {
      const rows = [];
      for (let index = 0; index < items.length; index += 2) rows.push(items.slice(index, index + 2));
      const h = 58 + Math.max(1, rows.length) * 34;
      const box = drawReadingBox(rc, x, y - h / 2, w, h, color, "Semantic Objects", "", {
        titleSize: 12,
        titleLines: 1,
        alpha: 0.035,
      });
      rows.forEach((row, rowIndex) => {
        row.forEach((item, columnIndex) => {
          const columnWidth = w / row.length;
          addText(item, x + columnWidth * (columnIndex + 0.5), box.y + 61 + rowIndex * 34, {
            size: 12,
            weight: 700,
            fill: "#3f4a55",
            anchor: "middle",
          });
        });
      });
      return box;
    }

    function drawReadingListPanel(rc, x, centerY, w, titleText, rows, color, options = {}) {
      const rowHeight = options.rowHeight || 54;
      const h = 58 + Math.max(1, rows.length) * rowHeight;
      const y = centerY - h / 2;
      const box = drawReadingBox(rc, x, y, w, h, color, titleText, "", {
        titleSize: 12,
        titleLines: 1,
        alpha: 0.035,
        dashed: options.dashed,
      });
      rows.forEach((row, index) => {
        const rowY = y + 58 + index * rowHeight;
        if (index > 0) {
          svg.appendChild(rc.line(x + 16, rowY - 8, x + w - 16, rowY - 8, {
            stroke: colorWithAlpha(color, 0.24),
            strokeWidth: 0.7,
            roughness: 0.45,
          }));
        }
        wrapText(row.title || row, x + 18, rowY + 7, w - 36, {
          size: options.textSize || 11,
          lineHeight: 14,
          charWidth: 5.8,
          maxLines: 2,
          weight: 720,
          fill: "#35414c",
        });
        if (row.body) {
          wrapText(row.body, x + 18, rowY + 34, w - 36, {
            size: 10,
            lineHeight: 13,
            charWidth: 5.4,
            maxLines: 1,
            weight: 500,
            fill: "#66717c",
          });
        }
      });
      return box;
    }

    function renderRepositoryReadingAtlas(data) {
      const systems = data.systems || [];
      const columnWidth = 840;
      const cardWidth = 790;
      const cardGap = 32;
      const left = 70;
      const top = 150;
      const routeStepHeight = 152;
      const runtimeProbeStepHeight = 216;
      const cardHeightFor = (module) => 400 + (module.mainRoute || []).length * (
        module.cardKind === "runtime_probe" ? runtimeProbeStepHeight : routeStepHeight
      );
      const moduleIndex = new Map();
      systems.forEach((system) => {
        (system.modules || []).forEach((module) => {
          moduleIndex.set(module.id, { ...module, color: system.color || "#64748b" });
        });
      });
      const runtimeModules = (data.runtimeOrder || []).map((id) => moduleIndex.get(id)).filter(Boolean);
      const supportModules = (data.supportOrder || []).map((id) => moduleIndex.get(id)).filter(Boolean);
      const maxRuntimeHeight = Math.max(1, ...runtimeModules.map(cardHeightFor));
      const supportTop = top + maxRuntimeHeight + 150;
      const maxSupportHeight = Math.max(1, ...supportModules.map(cardHeightFor));
      const width = Math.max(data.canvasWidth || 0, left * 2 + runtimeModules.length * columnWidth);
      const height = supportTop + maxSupportHeight + 100;
      setCanvas(width, height);
      const rc = rough.svg(svg);

      wrapText(data.subtitle || "", left, 62, width - left * 2, {
        size: 15,
        lineHeight: 20,
        charWidth: 7.4,
        maxLines: 2,
        weight: 500,
        fill: "#66717c",
      });

      addText("正式 Runtime 阅读顺序", left, 116, { size: 18, weight: 700, display: true, fill: "#26313d" });
      svg.appendChild(rc.line(left + 198, 111, width - left, 111, {
        stroke: "#c8c1b5", strokeWidth: 0.9, roughness: 0.35,
      }));

      const renderModuleCard = (module, cardX, cardY, sequenceLabel = "") => {
          const color = module.color || "#64748b";
          const cardHeight = cardHeightFor(module);
          const card = drawReadingBox(rc, cardX, cardY, cardWidth, cardHeight, color, module.title, "", {
            titleSize: 22,
            titleLines: 2,
            alpha: 0.04,
            strokeWidth: 1.25,
          });
          if (sequenceLabel) {
            addText(sequenceLabel, cardX + cardWidth - 22, cardY + 28, {
              size: 13, weight: 600, code: true, anchor: "end", fill: color,
            });
          }
          const contentX = cardX + 30;
          const contentWidth = cardWidth - 60;
          let cursorY = cardY + 68;
          const section = (label, value, x, width, maxLines = 4, code = false) => {
            addText(label, x, cursorY, { size: 15, weight: 600, fill: color });
            const used = wrapMultilineText(value || "UNCONFIRMED", x, cursorY + 24, width, {
              size: code ? 14 : 15.5,
              lineHeight: 22,
              charWidth: code ? 7.2 : 7.8,
              maxLines,
              weight: 500,
              code,
              fill: "#3f4a55",
            });
            return 36 + used * 22;
          };

          const files = module.files || [];
          const shortPath = (value) => String(value || "").replace(/\/$/, "").split("/").pop();
          const functionItems = [];
          files.forEach((file) => {
            (file.functions || []).forEach((fn) => functionItems.push(`${fn}  <-  ${shortPath(file.path)}`));
          });
          if (!functionItems.length) functionItems.push("按 Owner 文件职责顺序阅读");
          const isRuntimeProbe = module.cardKind === "runtime_probe";
          cursorY += section(isRuntimeProbe ? "验证断言" : "职责", module.owns || module.summary, contentX, contentWidth, 3);

          const halfGap = 26;
          const halfWidth = (contentWidth - halfGap) / 2;
          const columnStartY = cursorY;
          addText("先读", contentX, cursorY, { size: 15, weight: 600, fill: color });
          const visibleFiles = files.slice(0, 6);
          visibleFiles.forEach((file, fileIndex) => {
            addSourceTextLink(
              `${fileIndex + 1}. ${shortPath(file.path)}`,
              contentX,
              cursorY + 24 + fileIndex * 22,
              halfWidth,
              file,
            );
          });
          const readHeight = 36 + Math.max(1, visibleFiles.length) * 22;
          cursorY = columnStartY;
          const functionHeight = section("重点函数", readingList(functionItems), contentX + halfWidth + halfGap, halfWidth, 6, true);
          cursorY = columnStartY + Math.max(readHeight, functionHeight) + 8;

          cursorY += section(isRuntimeProbe ? "设计映射与不变量" : "核心对象", (module.objects || []).join(", "), contentX, contentWidth, 3, true);
          svg.appendChild(rc.line(contentX, cursorY - 6, contentX + contentWidth, cursorY - 6, {
            stroke: colorWithAlpha(color, 0.25),
            strokeWidth: 0.8,
            roughness: 0.35,
          }));
          addText(isRuntimeProbe ? "插桩前后运行时截面" : "模块内部主路径", contentX, cursorY + 18, { size: 17, weight: 650, display: true, fill: color });
          cursorY += 44;

          const parseRoute = (step, title) => {
            const prefix = String(step || "").match(/^(B\d+)\s+(.*)$/);
            const id = prefix ? prefix[1] : "B?";
            const rest = prefix ? prefix[2] : String(step || "");
            const arrowIndex = rest.indexOf(" -> ");
            const beforeArrow = arrowIndex >= 0 ? rest.slice(0, arrowIndex) : rest;
            const output = arrowIndex >= 0 ? rest.slice(arrowIndex + 4) : "UNCONFIRMED";
            const separator = beforeArrow.lastIndexOf(": ");
            return {
              id,
              title: title || "主路径步骤",
              owner: separator >= 0 ? beforeArrow.slice(0, separator) : beforeArrow,
              input: separator >= 0 ? beforeArrow.slice(separator + 2) : "UNCONFIRMED",
              output,
            };
          };

          (module.mainRoute || []).forEach((step, stepIndex) => {
            const route = parseRoute(step, (module.mainRouteTitles || [])[stepIndex]);
            const probeStep = (module.probeSteps || [])[stepIndex] || {};
            if (stepIndex > 0) addText("↓", contentX + 22, cursorY - 7, { size: 18, weight: 500, fill: color });
            const routeY = cursorY + (stepIndex > 0 ? 5 : 0);
            const routeBox = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            routeBox.setAttribute("x", contentX);
            routeBox.setAttribute("y", routeY);
            routeBox.setAttribute("width", contentWidth);
            routeBox.setAttribute("height", isRuntimeProbe ? 198 : 134);
            routeBox.setAttribute("rx", 4);
            routeBox.setAttribute("fill", colorWithAlpha(color, 0.045));
            routeBox.setAttribute("stroke", colorWithAlpha(color, 0.32));
            routeBox.setAttribute("stroke-width", 0.8);
            svg.appendChild(routeBox);
            addText(`${route.id}  ${route.title}`, contentX + 16, routeY + 23, {
              size: 16,
              weight: 650,
              display: true,
              fill: "#26313d",
            });
            if (isRuntimeProbe) {
              addText("为什么测这里", contentX + 16, routeY + 48, { size: 13, weight: 600, fill: color });
            }
            wrapText(isRuntimeProbe ? (probeStep.whyHere || "PENDING") : route.owner, contentX + (isRuntimeProbe ? 112 : 16), routeY + 47, contentWidth - (isRuntimeProbe ? 128 : 32), {
              size: 14, lineHeight: 18, charWidth: 7.2, maxLines: 2,
              weight: 500, code: !isRuntimeProbe, fill: "#485563",
            });
            const routeColumnWidth = (contentWidth - 24) / 2;
            const boundaryY = routeY + (isRuntimeProbe ? 112 : 96);
            addText(isRuntimeProbe ? "插桩位置" : "input", contentX + 16, boundaryY, { size: 13, weight: 600, code: true, fill: color });
            wrapText(isRuntimeProbe ? (probeStep.location || "PENDING") : route.input, contentX + 88, boundaryY, routeColumnWidth - 72, {
              size: 14.5, lineHeight: 18, charWidth: 7.4, maxLines: 2,
              weight: 500, fill: isRuntimeProbe && probeStep.sourceHref ? "#0b63b6" : "#3f4a55",
            });
            if (isRuntimeProbe && probeStep.sourceHref) {
              const sourceArrow = addText("↗", contentX + routeColumnWidth - 16, boundaryY, {
                size: 15, weight: 700, fill: "#0b63b6",
              });
              const sourceLink = document.createElementNS("http://www.w3.org/2000/svg", "a");
              sourceLink.setAttribute("href", probeStep.sourceHref);
              sourceLink.dataset.sourceLink = "true";
              sourceLink.addEventListener("mousedown", (event) => {
                event.stopPropagation();
              });
              sourceLink.addEventListener("click", (event) => {
                event.preventDefault();
                event.stopPropagation();
                sourceArrow.textContent = "…";
                fetch(probeStep.sourceHref, { method: "POST" })
                  .then((response) => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    sourceArrow.textContent = "✓";
                    sourceArrow.setAttribute("fill", "#287a45");
                  })
                  .catch((error) => {
                    sourceArrow.textContent = "!";
                    sourceArrow.setAttribute("fill", "#b42318");
                    console.error("Failed to open source location", error);
                  });
              });
              const hitArea = document.createElementNS("http://www.w3.org/2000/svg", "rect");
              hitArea.setAttribute("x", contentX + 8);
              hitArea.setAttribute("y", boundaryY - 18);
              hitArea.setAttribute("width", routeColumnWidth - 8);
              hitArea.setAttribute("height", 44);
              hitArea.setAttribute("fill", "transparent");
              hitArea.setAttribute("pointer-events", "all");
              hitArea.style.cursor = "pointer";
              const linkTitle = document.createElementNS("http://www.w3.org/2000/svg", "title");
              linkTitle.textContent = `打开源码 ${probeStep.location}`;
              sourceLink.appendChild(linkTitle);
              sourceLink.appendChild(hitArea);
              svg.appendChild(sourceLink);
            }
            const outputX = contentX + routeColumnWidth + 24;
            addText(isRuntimeProbe ? "截获对象" : "output", outputX, boundaryY, { size: 13, weight: 600, code: true, fill: color });
            wrapText(isRuntimeProbe ? (probeStep.capture || "PENDING") : route.output, outputX + 88, boundaryY, routeColumnWidth - 88, {
              size: 14.5, lineHeight: 18, charWidth: 7.4, maxLines: 2,
              weight: 500, fill: "#3f4a55",
            });
            if (isRuntimeProbe) {
              addText("失败归属", contentX + 16, routeY + 166, { size: 13, weight: 600, fill: color });
              wrapText(probeStep.failureOwner || "PENDING", contentX + 88, routeY + 165, contentWidth - 104, {
                size: 14, lineHeight: 18, charWidth: 7.2, maxLines: 2,
                weight: 500, fill: "#8a3d2f",
              });
            }
            cursorY = routeY + (isRuntimeProbe ? runtimeProbeStepHeight : routeStepHeight);
          });
          return card;
      };

      runtimeModules.forEach((module, index) => {
        const cardX = left + index * columnWidth;
        renderModuleCard(module, cardX, top, `R${String(index + 1).padStart(2, "0")}`);
        if (index > 0) {
          const connectorY = top - 18;
          svg.appendChild(rc.line(cardX - 50, connectorY, cardX - 12, connectorY, {
            stroke: module.color || "#64748b", strokeWidth: 1.1, roughness: 0.35,
          }));
          addText("→", cardX - 36, connectorY + 5, { size: 16, weight: 500, fill: module.color || "#64748b" });
        }
      });

      addText("Supporting Boundaries", left, supportTop - 42, {
        size: 18, weight: 700, display: true, fill: "#26313d",
      });
      svg.appendChild(rc.line(left + 205, supportTop - 47, width - left, supportTop - 47, {
        stroke: "#c8c1b5", strokeWidth: 0.9, roughness: 0.35,
      }));
      supportModules.forEach((module, index) => {
        renderModuleCard(module, left + index * columnWidth, supportTop, `S${String(index + 1).padStart(2, "0")}`);
      });
    }

    function render(data) {
      clearSvg();
      title.textContent = data.title || "UniLab Architecture Atlas";
      const layout = data.layout || "tabs";
      if (layout === "repo_tree") {
        renderRepoTree(data);
      } else if (layout === "design_transaction_inspector") {
        renderInspector(data);
      } else if (layout === "repository_reading_atlas") {
        renderRepositoryReadingAtlas(data);
      } else if (layout === "flow_tree") {
        renderFlowTree(data);
      } else if (layout === "method_figure") {
        renderMethodFigure(data);
      } else {
        renderTabs(data);
      }
      if ((layout === "repository_reading_atlas" || layout === "design_transaction_inspector") && autoFitWidth) {
        autoFitWidth = false;
        zoom = clampZoom(data.defaultZoom || (layout === "design_transaction_inspector" ? 0.8 : 0.65));
        requestAnimationFrame(() => {
          applyZoom();
          stage.scrollLeft = 0;
          stage.scrollTop = 0;
        });
      } else if (autoFitWidth) {
        requestAnimationFrame(() => fitWidth());
      }
    }

    async function loadFromFile(force = false) {
      if (!force && document.activeElement === source && sourceDirty) return;
      const response = await fetch(`${dataUrl}?t=${Date.now()}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const serialized = JSON.stringify(data, null, 2);
      if (!force && serialized === lastServerData) return;
      lastServerData = serialized;
      sourceDirty = false;
      source.value = serialized;
      render(data);
      setStatus(`loaded ${new Date().toLocaleTimeString()}`);
      hint.innerHTML = `Edit <code>${dataUrl.replace("./", "")}</code> in VSCode. Hide this editor for full-width review. Drag the canvas to pan; use zoom controls or trackpad scroll for large maps.`;
    }

    function renderEditor() {
      try {
        const data = JSON.parse(source.value);
        render(data);
        setStatus(`rendered editor ${new Date().toLocaleTimeString()}`);
      } catch (error) {
        setStatus(`JSON error: ${error.message}`);
      }
    }

    reloadButton.addEventListener("click", () => loadFromFile(true).catch((error) => setStatus(error.message)));
    renderButton.addEventListener("click", renderEditor);
    toggleEditorButton.addEventListener("click", () => {
      layout.classList.toggle("editor-hidden");
      toggleEditorButton.textContent = layout.classList.contains("editor-hidden") ? "Show Editor" : "Hide Editor";
      requestAnimationFrame(() => {
        if (autoFitWidth) {
          fitWidth();
        } else {
          applyZoom();
        }
      });
    });
    zoomOutButton.addEventListener("click", () => setZoom(zoom / 1.18));
    zoomInButton.addEventListener("click", () => setZoom(zoom * 1.18));
    zoomFitButton.addEventListener("click", fitWidth);
    zoomResetButton.addEventListener("click", () => setZoom(1));
    stage.addEventListener("wheel", (event) => {
      if (!event.ctrlKey && !event.metaKey) return;
      event.preventDefault();
      const rect = stage.getBoundingClientRect();
      const anchor = {
        x: stage.scrollLeft + event.clientX - rect.left,
        y: stage.scrollTop + event.clientY - rect.top,
      };
      autoFitWidth = false;
      zoom = clampZoom(zoom * (event.deltaY > 0 ? 0.92 : 1.08));
      applyZoom(anchor);
    }, { passive: false });
    window.addEventListener("resize", () => {
      if (autoFitWidth) {
        requestAnimationFrame(() => fitWidth());
      }
    });
    stage.addEventListener("mousedown", (event) => {
      if (event.button !== 0 || event.target.closest("button, a, [data-source-link='true']")) return;
      isPanning = true;
      panStartX = event.clientX;
      panStartY = event.clientY;
      panScrollLeft = stage.scrollLeft;
      panScrollTop = stage.scrollTop;
      stage.classList.add("dragging");
    });
    window.addEventListener("mousemove", (event) => {
      if (!isPanning) return;
      stage.scrollLeft = panScrollLeft - (event.clientX - panStartX);
      stage.scrollTop = panScrollTop - (event.clientY - panStartY);
    });
    window.addEventListener("mouseup", () => {
      if (!isPanning) return;
      isPanning = false;
      stage.classList.remove("dragging");
    });
    source.addEventListener("input", () => {
      sourceDirty = true;
      window.clearTimeout(source._renderTimer);
      source._renderTimer = window.setTimeout(renderEditor, 250);
    });

    if ("EventSource" in window) {
      const events = new EventSource("/events");
      events.addEventListener("architecture-data", () => {
        loadFromFile().catch((error) => setStatus(error.message));
      });
    }

    window.setInterval(() => {
      loadFromFile().catch(() => {});
    }, 1500);

    loadFromFile(true).catch((error) => {
      source.value = JSON.stringify({ title: "UniLab Architecture Atlas", layout: "repo_tree", files: [] }, null, 2);
      renderEditor();
      setStatus(`open through serve_architecture.mjs: ${error.message}`);
    });
  </script>
</body>
</html>
