    function methodAnchor(node, anchor, offset = 0) {
      const cx = node.x + node.w / 2;
      const cy = node.y + node.h / 2;
      const delta = Number.isFinite(Number(offset)) ? Number(offset) : 0;
      if (anchor === "left") return [node.x, cy + delta];
      if (anchor === "right") return [node.x + node.w, cy + delta];
      if (anchor === "top") return [cx + delta, node.y];
      if (anchor === "bottom") return [cx + delta, node.y + node.h];
      return [cx, cy];
    }

    function methodEdgeAnchors(from, to, edge) {
      if (edge.fromAnchor || edge.toAnchor) {
        return [
          methodAnchor(from, edge.fromAnchor || "right", edge.fromOffset),
          methodAnchor(to, edge.toAnchor || "left", edge.toOffset),
        ];
      }
      const dx = (to.x + to.w / 2) - (from.x + from.w / 2);
      const dy = (to.y + to.h / 2) - (from.y + from.h / 2);
      if (Math.abs(dx) >= Math.abs(dy)) {
        return [methodAnchor(from, dx >= 0 ? "right" : "left"), methodAnchor(to, dx >= 0 ? "left" : "right")];
      }
      return [methodAnchor(from, dy >= 0 ? "bottom" : "top"), methodAnchor(to, dy >= 0 ? "top" : "bottom")];
    }

    function methodLongestSegmentMidpoint(points) {
      let best = { length: -1, x: points[0][0], y: points[0][1] };
      for (let idx = 1; idx < points.length; idx += 1) {
        const a = points[idx - 1];
        const b = points[idx];
        const length = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (length > best.length) {
          best = { length, x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2 };
        }
      }
      return best;
    }

    function drawMethodArrowHead(points, color) {
      if (points.length < 2) return;
      const end = points[points.length - 1];
      const prev = points[points.length - 2];
      const angle = Math.atan2(end[1] - prev[1], end[0] - prev[0]);
      const size = 10;
      const wing = 5.5;
      const baseX = end[0] - Math.cos(angle) * size;
      const baseY = end[1] - Math.sin(angle) * size;
      const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      polygon.setAttribute("points", [
        `${end[0]},${end[1]}`,
        `${baseX + Math.sin(angle) * wing},${baseY - Math.cos(angle) * wing}`,
        `${baseX - Math.sin(angle) * wing},${baseY + Math.cos(angle) * wing}`,
      ].join(" "));
      polygon.setAttribute("fill", color);
      svg.appendChild(polygon);
    }

    function drawMethodNode(rc, data, node) {
      const textScale = node.viewScale || data.viewScale || 1;
      const color = conceptColor(data, node.concept, node.color || "#6688aa");
      const compact = node.h < 140;
      const shapeOptions = {
        stroke: color,
        strokeWidth: node.kind === "external" ? 1.4 : 1.8,
        strokeLineDash: node.kind === "external" ? [7, 5] : undefined,
        roughness: 1.05,
        bowing: 0.7,
        fill: colorWithAlpha(color, node.kind === "external" ? 0.025 : compact ? 0.08 : 0.12),
        fillStyle: "solid",
      };
      const inset = Math.min(
        Number.isFinite(Number(node.shapeInset)) ? Number(node.shapeInset) : 42,
        node.w * 0.3,
        node.h * 0.35,
      );
      let shape;
      if (node.shape === "encoder") {
        shape = rc.polygon([
          [node.x, node.y],
          [node.x + node.w, node.y + inset],
          [node.x + node.w, node.y + node.h - inset],
          [node.x, node.y + node.h],
        ], shapeOptions);
      } else if (node.shape === "decoder") {
        shape = rc.polygon([
          [node.x, node.y + inset],
          [node.x + node.w, node.y],
          [node.x + node.w, node.y + node.h],
          [node.x, node.y + node.h - inset],
        ], shapeOptions);
      } else if (node.shape === "context_encoder") {
        shape = rc.polygon([
          [node.x, node.y],
          [node.x + node.w, node.y],
          [node.x + node.w - inset, node.y + node.h],
          [node.x + inset, node.y + node.h],
        ], shapeOptions);
      } else {
        shape = rc.rectangle(node.x, node.y, node.w, node.h, shapeOptions);
      }
      const tooltip = document.createElementNS("http://www.w3.org/2000/svg", "title");
      const codeRefs = (node.codeRefs || []).join("\n");
      tooltip.textContent = `${node.id} ${node.title}\n${node.summary || ""}${codeRefs ? `\n\nCode:\n${codeRefs}` : ""}`;
      shape.appendChild(tooltip);
      svg.appendChild(shape);

      if (node.frozen) {
        const badgeX = node.x + node.w - (node.shape === "encoder" ? 10 : 14);
        const badgeY = node.y + (node.shape === "encoder" ? inset + 16 : 18);
        addText("❄", badgeX, badgeY, {
          fill: "#2563eb",
          size: 15 * textScale,
          weight: 700,
          anchor: "middle",
        });
      }

      const centeredTrackerText = node.shape === "encoder" || node.shape === "decoder";
      if (centeredTrackerText) {
        const centerX = node.x + node.w / 2;
        const centerY = node.y + node.h / 2;
        wrapText(node.title, centerX, centerY - 12, node.w - 90, {
          size: 14 * textScale,
          lineHeight: 16 * textScale,
          charWidth: 7 * textScale,
          maxLines: 2,
          weight: 900,
          fill: "#27313d",
          anchor: "middle",
        });
        wrapText(node.summary || "", centerX, centerY + 20, node.w - 74, {
          size: 11 * textScale,
          lineHeight: 15 * textScale,
          charWidth: 5.8 * textScale,
          maxLines: 3,
          weight: 550,
          fill: "#4d5966",
          anchor: "middle",
        });
        return;
      }

      const textInset = node.id.endsWith("-LOSS") || node.id.endsWith("-PROOF") ? 24 * textScale : node.shape === "context_encoder" ? 34 : node.shape ? 26 : 16;
      const titleLines = wrapText(node.title, node.x + textInset, node.y + 36 * textScale, node.w - textInset * 2, {
        size: (node.titleSize || (compact ? 13 : 14)) * textScale,
        lineHeight: 16 * textScale,
        charWidth: 7 * textScale,
        maxLines: 2,
        weight: 900,
        fill: "#27313d",
      });
      const summaryLineHeight = (node.summaryLineHeight || (compact ? 13 : 15)) * textScale;
      const summaryY = node.y + 68 * textScale + Math.max(0, titleLines - 1) * 19 * textScale;
      const summaryBottom = node.y + node.h - 18 * textScale;
      const summaryMaxLines = Math.max(1, Math.floor((summaryBottom - summaryY) / summaryLineHeight));
      wrapMultilineText(node.summary || "", node.x + textInset, summaryY, node.w - textInset * 2, {
        size: (node.summarySize || (compact ? 10 : 11)) * textScale,
        lineHeight: summaryLineHeight,
        charWidth: (compact ? 5.4 : 5.8) * textScale,
        maxLines: summaryMaxLines,
        weight: 550,
        fill: "#4d5966",
      });
    }

    function renderMethodFigure(data) {
      const width = data.figureWidth || 1800;
      const height = data.figureHeight || 800;
      setCanvas(width, height);
      const rc = rough.svg(svg);
      const nodes = new Map((data.nodes || []).map((node) => [node.id, node]));

      const layerDividers = data.layerDividers || (data.layerDivider ? [data.layerDivider] : []);
      layerDividers.forEach((divider) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", divider.x1 ?? 40);
        line.setAttribute("x2", divider.x2 ?? width - 40);
        line.setAttribute("y1", divider.y);
        line.setAttribute("y2", divider.y);
        line.setAttribute("stroke", divider.stroke || "#8b8174");
        line.setAttribute("stroke-width", divider.strokeWidth || 1.5);
        line.setAttribute("stroke-dasharray", divider.dashArray || "12 10");
        line.setAttribute("opacity", divider.opacity || 0.72);
        svg.appendChild(line);
        if (divider.topLabel) {
          addText(divider.topLabel, (divider.x1 ?? 40) + 8, divider.y - 14, {
            size: 13,
            weight: 760,
            fill: "#5f584f",
          });
        }
        if (divider.bottomLabel) {
          addText(divider.bottomLabel, (divider.x1 ?? 40) + 8, divider.y + 27, {
            size: 13,
            weight: 760,
            fill: "#5f584f",
          });
        }
      });

      const edgeLabels = [];
      (data.edges || []).forEach((edge) => {
        const from = nodes.get(edge.from);
        const to = nodes.get(edge.to);
        if (!from || !to) return;
        const [start, end] = methodEdgeAnchors(from, to, edge);
        const points = [start, ...(edge.via || []), end];
        const color = conceptColor(data, edge.concept || from.concept, "#667085");
        svg.appendChild(rc.linearPath(points, {
          stroke: color,
          strokeWidth: edge.kind === "feedback" ? 2.8 : 2.1,
          roughness: edge.orthogonal ? 0 : 0.9,
          bowing: edge.orthogonal ? 0 : 0.65,
          strokeLineDash: edge.kind === "evidence" ? [7, 5] : undefined,
        }));
        drawMethodArrowHead(points, color);
        if (edge.label || edge.labelLines?.length) {
          const midpoint = methodLongestSegmentMidpoint(points);
          edgeLabels.push({
            ...midpoint,
            x: edge.labelX ?? midpoint.x,
            y: edge.labelY ?? midpoint.y,
            text: edge.label,
            lines: edge.labelLines?.length ? edge.labelLines : [edge.label],
            anchor: edge.labelAnchor || "middle",
            lineHeight: edge.labelLineHeight || (edge.labelSize || 11) + 4,
            color,
            size: edge.labelSize || 11,
          });
        }
      });

      (data.nodes || []).forEach((node) => drawMethodNode(rc, data, node));

      edgeLabels.forEach((label) => {
        const firstY = label.y - 8 - ((label.lines.length - 1) * label.lineHeight) / 2;
        label.lines.forEach((line, index) => {
          const text = addText(line, label.x, firstY + index * label.lineHeight, {
            size: label.size,
            weight: 750,
            fill: label.color,
            anchor: label.anchor,
          });
          text.setAttribute("paint-order", "stroke");
          text.setAttribute("stroke", "#fffdf6");
          text.setAttribute("stroke-width", "5");
          text.setAttribute("stroke-linejoin", "round");
        });
      });

    }

    function drawReadingBox(rc, x, y, w, h, color, titleText, bodyText = "", options = {}) {
      const shape = rc.rectangle(x, y, w, h, {
        stroke: color,
        strokeWidth: options.strokeWidth || 1.6,
        roughness: 0.82,
        bowing: 0.45,
        fill: colorWithAlpha(color, options.alpha ?? 0.055),
        fillStyle: "solid",
        strokeLineDash: options.dashed ? [8, 6] : undefined,
      });
      svg.appendChild(shape);
      wrapText(titleText || "", x + 16, y + 27, w - 32, {
        size: options.titleSize || 13,
        lineHeight: 16,
        charWidth: 6.8,
        maxLines: options.titleLines || 2,
        weight: 700,
        display: true,
        fill: "#26313d",
      });
      if (bodyText) {
        wrapText(bodyText, x + 16, y + 53, w - 32, {
          size: options.bodySize || 10,
          lineHeight: 14,
          charWidth: 5.6,
          maxLines: options.bodyLines || Math.max(1, Math.floor((h - 64) / 14)),
          weight: 500,
          fill: "#51606d",
        });
      }
      return { x, y, w, h };
    }

    function drawReadingConnector(rc, from, to, color, dashed = false) {
      const start = [from.x + from.w, from.y + from.h / 2];
      const end = [to.x, to.y + to.h / 2];
      const midX = start[0] + Math.max(34, (end[0] - start[0]) * 0.48);
      svg.appendChild(rc.linearPath([start, [midX, start[1]], [midX, end[1]], end], {
        stroke: color,
        strokeWidth: 1.35,
        roughness: 0.72,
        bowing: 0.35,
        strokeLineDash: dashed ? [7, 6] : undefined,
      }));
    }

    function readingList(items) {
      return (items || []).filter(Boolean).map((item, index) => `${index + 1}. ${item}`).join("\n");
    }

    function drawCenteredCluster(rc, x, y, w, items, color) {
      const rows = [];
      for (let index = 0; index < items.length; index += 2) rows.push(items.slice(index, index + 2));
      const h = 58 + Math.max(1, rows.length) * 34;
      const box = drawReadingBox(rc, x, y - h / 2, w, h, color, "Semantic Objects", "", {
        titleSize: 12,
        titleLines: 1,
        alpha: 0.035,
      });
      rows.forEach((row, rowIndex) => {
        row.forEach((item, columnIndex) => {
          const columnWidth = w / row.length;
          addText(item, x + columnWidth * (columnIndex + 0.5), box.y + 61 + rowIndex * 34, {
            size: 12,
            weight: 700,
            fill: "#3f4a55",
            anchor: "middle",
          });
        });
      });
      return box;
    }

    function drawReadingListPanel(rc, x, centerY, w, titleText, rows, color, options = {}) {
      const rowHeight = options.rowHeight || 54;
      const h = 58 + Math.max(1, rows.length) * rowHeight;
      const y = centerY - h / 2;
      const box = drawReadingBox(rc, x, y, w, h, color, titleText, "", {
        titleSize: 12,
        titleLines: 1,
        alpha: 0.035,
        dashed: options.dashed,
      });
      rows.forEach((row, index) => {
        const rowY = y + 58 + index * rowHeight;
        if (index > 0) {
          svg.appendChild(rc.line(x + 16, rowY - 8, x + w - 16, rowY - 8, {
            stroke: colorWithAlpha(color, 0.24),
            strokeWidth: 0.7,
            roughness: 0.45,
          }));
        }
        wrapText(row.title || row, x + 18, rowY + 7, w - 36, {
          size: options.textSize || 11,
          lineHeight: 14,
          charWidth: 5.8,
          maxLines: 2,
          weight: 720,
          fill: "#35414c",
        });
        if (row.body) {
          wrapText(row.body, x + 18, rowY + 34, w - 36, {
            size: 10,
            lineHeight: 13,
            charWidth: 5.4,
            maxLines: 1,
            weight: 500,
            fill: "#66717c",
          });
        }
      });
      return box;
    }

    function renderInspector(data) {
      const moduleCards = Array.isArray(data.cards) ? data.cards : [];
      const stageCards = Array.isArray(data.stageCards) ? data.stageCards : [];
      const cards = [...stageCards, ...moduleCards];
      const defaultSteps = Array.isArray(data.transaction?.steps) ? data.transaction.steps : [];
      const width = 1680;
      const left = 44;
      const contentWidth = width - left * 2;
      const rc = rough.svg(svg);
      if (!cards.length || !defaultSteps.length) {
        setCanvas(width, 1040);
        drawHeader(data, data.subtitle, width);
        addText(`${data.spineName || "Inspector"} 数据为空`, left, 188, { size: 20, weight: 720, fill: "#9b3f32" });
        return;
      }
      if (!activeInspectorCardId || !cards.some((card) => card.designId === activeInspectorCardId)) {
        activeInspectorCardId = cards[0].designId;
      }
      const activeCard = cards.find((card) => card.designId === activeInspectorCardId) || cards[0];
      const inspectorTransaction = activeCard.transaction || data.transaction || {};
      const steps = Array.isArray(inspectorTransaction.steps) ? inspectorTransaction.steps : defaultSteps;
      const highlightSteps = new Set(activeCard.highlightSteps || []);
      const activeColor = activeCard.color || "#64748b";

      const selectorTop = 130;
      const selectorColumns = 5;
      const selectorRows = Math.ceil(cards.length / selectorColumns);
      const selectorGap = 14;
      const selectorWidth = (contentWidth - selectorGap * (selectorColumns - 1)) / selectorColumns;
      const selectorHeight = 68;
      const transactionTop = selectorTop + selectorRows * (selectorHeight + 12) + 24;
      const detailRows = Array.isArray(activeCard.details) ? activeCard.details : [];
      const showsExecution = data.layout === "module_test_inspector";
      const executionLabels = { passed: "已通过", partial: "部分覆盖", blocked: "阻塞", ready: "当前阶段" };
      const executionColors = { passed: "#26734d", partial: "#9a6718", blocked: "#a33f32" };
      const executionLabel = executionLabels[activeCard.executionStatus] || "尚未执行";
      const executionColor = executionColors[activeCard.executionStatus] || "#66717c";
      const executionPrefix = activeCard.cardKind === "stage-reading" ? "阶段状态" : "测试结果";
      const detailHeaderHeight = showsExecution ? 116 : 64;
      const detailTextWidth = Math.min(contentWidth - 88, 1120);
      const detailTextOptions = { charWidth: 7.4 };
    const detailFormulaHeight = 76;
      const detailFormulaGap = 4;
      const detailTableFor = (row) => (
        row?.table && Array.isArray(row.table.columns) && Array.isArray(row.table.rows)
          ? row.table
          : null
      );
      const detailTableHeightFor = (table) => table ? 48 + table.rows.length * 58 : 0;
      const detailFormulasFor = (row) => {
        if (Array.isArray(row?.latex)) return row.latex.filter((formula) => typeof formula === "string" && formula.trim());
        if (typeof row?.latex === "string" && row.latex.trim()) return [row.latex];
        return [];
      };
      const detailRowHeightFor = (detail) => {
        const row = typeof detail === "string" ? { text: detail } : detail;
        const textLines = measuredLineCount(row?.text || "", detailTextWidth, detailTextOptions);
        const table = detailTableFor(row);
        const formulas = detailFormulasFor(row);
        const headingHeight = row?.heading ? 25 : 0;
        const tableHeight = table ? 12 + detailTableHeightFor(table) : 0;
        const formulaHeight = formulas.length
          ? 10 + formulas.length * detailFormulaHeight + (formulas.length - 1) * detailFormulaGap
          : 0;
        return 32 + headingHeight + textLines * 20 + tableHeight + formulaHeight;
      };
      const detailTop = transactionTop + 360;
      const detailHeight = detailHeaderHeight + detailRows.reduce(
        (sum, detail) => sum + detailRowHeightFor(detail),
        0,
      );
      const height = Math.max(1040, detailTop + detailHeight + 54);

      setCanvas(width, height);
      drawHeader(data, data.subtitle, width);

      cards.forEach((card, index) => {
        const column = index % selectorColumns;
        const row = Math.floor(index / selectorColumns);
        const x = left + column * (selectorWidth + selectorGap);
        const y = selectorTop + row * (selectorHeight + 12);
        const selected = card.designId === activeCard.designId;
        const color = card.color || "#64748b";
        drawCard(rc, x, y, selectorWidth, selectorHeight, color, {
          stroke: selected ? color : colorWithAlpha(color, 0.5),
          strokeWidth: selected ? 2.3 : 0.9,
          roughness: selected ? 1.0 : 0.45,
          bowing: 0.3,
          fill: selected ? colorWithAlpha(color, 0.18) : "rgba(255,255,255,0.68)",
        });
        addText(`${card.designId} / ${card.blockId}`, x + 13, y + 20, {
          size: 10.8, weight: 700, code: true, fill: color,
        });
        wrapText(card.title, x + 13, y + 44, selectorWidth - 26, {
          size: 16.5, lineHeight: 19, charWidth: 8.0, maxLines: 1, weight: 760, fill: "#26313d",
        });

        const hit = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        hit.setAttribute("x", x);
        hit.setAttribute("y", y);
        hit.setAttribute("width", selectorWidth);
        hit.setAttribute("height", selectorHeight);
        hit.setAttribute("fill", "transparent");
        hit.setAttribute("pointer-events", "all");
        hit.setAttribute("role", "button");
        hit.setAttribute("data-inspector-kind", card.cardKind || "module-test");
        hit.setAttribute("tabindex", "0");
        hit.setAttribute("aria-label", `查看 ${card.title} 的 Inspector 卡片`);
        hit.style.cursor = "pointer";
        const selectCard = (event) => {
          event.preventDefault();
          event.stopPropagation();
          activeInspectorCardId = card.designId;
          render(data);
        };
        hit.addEventListener("mousedown", (event) => event.stopPropagation());
        hit.addEventListener("click", selectCard);
        hit.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") selectCard(event);
        });
        svg.appendChild(hit);
      });

      const phaseTitles = inspectorTransaction.phaseTitles || {};
      const phaseDefinitions = [
        { id: "pre", title: phaseTitles.pre || "进入 Transaction", y: transactionTop },
        { id: "collection", title: phaseTitles.collection || "收集与执行", y: transactionTop + 144 },
        { id: "update", title: phaseTitles.update || "提交与更新", y: transactionTop + 258 },
      ];
      const phaseLabelWidth = 126;
      const stepGap = 13;
      const stepHeight = 76;

      const drawPhase = (phase) => {
        const phaseSteps = steps.filter((step) => step.phase === phase.id);
        const startX = left + phaseLabelWidth;
        const availableWidth = contentWidth - phaseLabelWidth;
        const stepWidth = Math.min(248, (availableWidth - stepGap * (phaseSteps.length - 1)) / phaseSteps.length);
        addText(phase.title, left, phase.y + 36, {
          size: 15, weight: 760, display: true, fill: "#485563",
        });
        phaseSteps.forEach((step, index) => {
          const globalIndex = steps.findIndex((item) => item.id === step.id) + 1;
          const x = startX + index * (stepWidth + stepGap);
          const selected = highlightSteps.has(step.id);
          const stroke = selected ? activeColor : "#aeb7c1";
          drawCard(rc, x, phase.y, stepWidth, stepHeight, stroke, {
            stroke,
            strokeWidth: selected ? 2.2 : 0.85,
            roughness: selected ? 0.95 : 0.35,
            bowing: 0.28,
            fill: selected ? colorWithAlpha(activeColor, 0.18) : "rgba(247,248,249,0.82)",
          });
          addText(String(globalIndex).padStart(2, "0"), x + 12, phase.y + 18, {
            size: 10.5, weight: 760, code: true, fill: selected ? activeColor : "#8d98a4",
          });
          wrapText(step.label, x + 12, phase.y + 41, stepWidth - 24, {
            size: phaseSteps.length >= 7 ? 12.9 : 14.0,
            lineHeight: 16,
            charWidth: phaseSteps.length >= 7 ? 6.5 : 7.0,
            maxLines: 2,
            weight: selected ? 760 : 600,
            fill: selected ? "#26313d" : "#626e7a",
          });
          const hit = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          hit.setAttribute("x", x);
          hit.setAttribute("y", phase.y);
          hit.setAttribute("width", stepWidth);
          hit.setAttribute("height", stepHeight);
          hit.setAttribute("fill", "transparent");
          hit.setAttribute("pointer-events", "all");
          const tooltip = document.createElementNS("http://www.w3.org/2000/svg", "title");
          tooltip.textContent = step.detail;
          hit.appendChild(tooltip);
          svg.appendChild(hit);
          if (index < phaseSteps.length - 1) {
            addText("→", x + stepWidth + 1, phase.y + 44, {
              size: 15, weight: 700, fill: "#89939e",
            });
          }
        });
      };
      phaseDefinitions.forEach(drawPhase);
      addText("↓", width - 72, phaseDefinitions[0].y + 99, { size: 18, weight: 760, fill: "#89939e" });
      addText("↓", width - 72, phaseDefinitions[1].y + 99, { size: 18, weight: 760, fill: "#89939e" });

      svg.appendChild(rc.rectangle(left, detailTop, contentWidth, detailHeight, {
        stroke: activeColor,
        strokeWidth: 1.2,
        roughness: 0.5,
        bowing: 0.25,
        fill: colorWithAlpha(activeColor, 0.075),
        fillStyle: "solid",
      }));
      addText(activeCard.title, left + 22, detailTop + 34, {
        size: 20, weight: 780, display: true, fill: activeColor,
      });
      if (showsExecution) {
        addText(`${executionPrefix}：${executionLabel}`, left + 22, detailTop + 62, {
          size: 14.5, weight: 760, display: true, fill: executionColor,
        });
        wrapText(activeCard.executionSummary || "尚无执行记录。", left + 22, detailTop + 88, contentWidth - 44, {
          size: 13.5, lineHeight: 18, charWidth: 7.0, maxLines: 2, weight: 560, fill: "#4f5b67",
        });
      }
      let detailOffset = 0;
      detailRows.forEach((detail, index) => {
        const row = typeof detail === "string" ? { text: detail } : detail;
        const rowTop = detailTop + detailHeaderHeight + detailOffset;
        const rowHeight = detailRowHeightFor(detail);
        const rowY = rowTop + 20;
        addText(String(index + 1), left + 22, rowY, {
          size: 11.5, weight: 760, code: true, fill: activeColor,
        });
        let bodyY = rowY;
        if (row.heading) {
          addText(row.heading, left + 64, rowY, {
            size: 17, weight: 760, display: true, fill: "#26313d",
          });
          bodyY += 27;
        }
        const textLines = wrapText(row.text, left + 64, bodyY, detailTextWidth, {
          size: 15.5, lineHeight: 20, charWidth: 7.4, weight: 570, fill: "#34414e",
        });
        const table = detailTableFor(row);
        let contentY = bodyY + textLines * 20 + 6;
        if (table) {
          const tableHeight = detailTableHeightFor(table);
          addDetailTable(table, left + 64, contentY + 6, detailTextWidth, tableHeight);
          contentY += tableHeight + 12;
        }
        const formulas = detailFormulasFor(row);
        let formulaY = contentY;
        formulas.forEach((formula) => {
          addLatex(formula, left + 64, formulaY, detailTextWidth, {
            height: detailFormulaHeight,
            size: 18,
          });
          formulaY += detailFormulaHeight + detailFormulaGap;
        });
        if (index < detailRows.length - 1) {
          const separator = document.createElementNS("http://www.w3.org/2000/svg", "line");
          separator.setAttribute("x1", left + 20);
          separator.setAttribute("x2", left + contentWidth - 20);
          separator.setAttribute("y1", rowTop + rowHeight);
          separator.setAttribute("y2", rowTop + rowHeight);
          separator.setAttribute("stroke", colorWithAlpha(activeColor, 0.22));
          separator.setAttribute("stroke-width", "1");
          svg.appendChild(separator);
        }
        detailOffset += rowHeight;
      });

      addText(activeCard.footerText || data.footerText || "按钮选择设计点；中间链路显示作用位置；下方阅读卡列出细节设计决定。", left, height - 24, {
        size: 13, weight: 620, fill: "#687481",
      });
    }

    function renderRepositoryReadingAtlas(data) {
      const systems = data.systems || [];
      const columnWidth = 840;
      const cardWidth = 790;
      const cardGap = 32;
      const left = 70;
      const top = 150;
      const routeStepHeight = 152;
      const runtimeProbeStepHeight = 216;
      const cardHeightFor = (module) => 400 + (module.mainRoute || []).length * (
        module.cardKind === "runtime_probe" ? runtimeProbeStepHeight : routeStepHeight
      );
      const moduleIndex = new Map();
      systems.forEach((system) => {
        (system.modules || []).forEach((module) => {
          moduleIndex.set(module.id, { ...module, color: system.color || "#64748b" });
        });
      });
      const runtimeModules = (data.runtimeOrder || []).map((id) => moduleIndex.get(id)).filter(Boolean);
      const supportModules = (data.supportOrder || []).map((id) => moduleIndex.get(id)).filter(Boolean);
      const maxRuntimeHeight = Math.max(1, ...runtimeModules.map(cardHeightFor));
      const supportTop = top + maxRuntimeHeight + 150;
      const maxSupportHeight = Math.max(1, ...supportModules.map(cardHeightFor));
      const width = Math.max(data.canvasWidth || 0, left * 2 + runtimeModules.length * columnWidth);
      const height = supportTop + maxSupportHeight + 100;
      setCanvas(width, height);
      const rc = rough.svg(svg);

      const attachSourceLink = (href, label, x, y, width, height, indicator) => {
        if (!href) return;
        const sourceLink = document.createElementNS("http://www.w3.org/2000/svg", "a");
        sourceLink.setAttribute("href", href);
        sourceLink.dataset.sourceLink = "true";
        sourceLink.addEventListener("mousedown", (event) => event.stopPropagation());
        sourceLink.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (indicator) indicator.textContent = "…";
          fetch(href, { method: "POST" })
            .then((response) => {
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              if (indicator) {
                indicator.textContent = "✓";
                indicator.setAttribute("fill", "#287a45");
              }
            })
            .catch((error) => {
              if (indicator) {
                indicator.textContent = "!";
                indicator.setAttribute("fill", "#b42318");
              }
              console.error("Failed to open source location", error);
            });
        });
        const hitArea = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        hitArea.setAttribute("x", x);
        hitArea.setAttribute("y", y);
        hitArea.setAttribute("width", width);
        hitArea.setAttribute("height", height);
        hitArea.setAttribute("fill", "transparent");
        hitArea.setAttribute("pointer-events", "all");
        hitArea.style.cursor = "pointer";
        const linkTitle = document.createElementNS("http://www.w3.org/2000/svg", "title");
        linkTitle.textContent = `打开源码 ${label}`;
        sourceLink.appendChild(linkTitle);
        sourceLink.appendChild(hitArea);
        svg.appendChild(sourceLink);
      };

      wrapText(data.subtitle || "", left, 62, width - left * 2, {
        size: 15,
        lineHeight: 20,
        charWidth: 7.4,
        maxLines: 2,
        weight: 500,
        fill: "#66717c",
      });

      addText("正式 Runtime 阅读顺序", left, 116, { size: 18, weight: 700, display: true, fill: "#26313d" });
      svg.appendChild(rc.line(left + 198, 111, width - left, 111, {
        stroke: "#c8c1b5", strokeWidth: 0.9, roughness: 0.35,
      }));

      const renderModuleCard = (module, cardX, cardY, sequenceLabel = "") => {
          const color = module.color || "#64748b";
          const cardHeight = cardHeightFor(module);
          const card = drawReadingBox(rc, cardX, cardY, cardWidth, cardHeight, color, module.title, "", {
            titleSize: 22,
            titleLines: 2,
            alpha: 0.04,
            strokeWidth: 1.25,
          });
          if (sequenceLabel) {
            addText(sequenceLabel, cardX + cardWidth - 22, cardY + 28, {
              size: 13, weight: 600, code: true, anchor: "end", fill: color,
            });
          }
          const contentX = cardX + 30;
          const contentWidth = cardWidth - 60;
          let cursorY = cardY + 68;
          const section = (label, value, x, width, maxLines = 4, code = false) => {
            addText(label, x, cursorY, { size: 15, weight: 600, fill: color });
            const used = wrapMultilineText(value || "UNCONFIRMED", x, cursorY + 24, width, {
              size: code ? 14 : 15.5,
              lineHeight: 22,
              charWidth: code ? 7.2 : 7.8,
              maxLines,
              weight: 500,
              code,
              fill: "#3f4a55",
            });
            return 36 + used * 22;
          };

          const files = module.files || [];
          const shortPath = (value) => String(value || "").replace(/\/$/, "").split("/").pop();
          const sourceHrefFor = (file) => {
            if (file.sourceHref) return file.sourceHref;
            if (!file.path || String(file.path).endsWith("/") || String(file.path).includes("*")) return "";
            const sourcePath = String(file.path).split("::")[0].trim();
            return `/open-source?path=${encodeURIComponent(sourcePath)}&line=${file.sourceLine || 1}`;
          };
          const sourceFileForOwner = (owner) => {
            const ownerText = String(owner || "");
            const pathMatch = files.find((file) => ownerText.includes(shortPath(file.path)));
            if (pathMatch) return pathMatch;
            const functionMatch = files.find((file) => (file.functions || []).some((fn) => {
              const symbol = String(fn).match(/([A-Za-z_]\w*)\s*\(/)?.[1];
              return symbol && ownerText.includes(symbol);
            }));
            if (functionMatch) return functionMatch;
            return files.length === 1 ? files[0] : null;
          };
          const functionItems = [];
          files.forEach((file) => {
            (file.functions || []).forEach((fn) => functionItems.push(`${fn}  <-  ${shortPath(file.path)}`));
          });
          if (!functionItems.length) functionItems.push("按 Owner 文件职责顺序阅读");
          const isRuntimeProbe = module.cardKind === "runtime_probe";
          cursorY += section(isRuntimeProbe ? "验证断言" : "职责", module.owns || module.summary, contentX, contentWidth, 3);

          const halfGap = 26;
          const halfWidth = (contentWidth - halfGap) / 2;
          const columnStartY = cursorY;
          addText("先读", contentX, cursorY, { size: 15, weight: 600, fill: color });
          let readLineCount = 0;
          files.slice(0, 6).forEach((file, fileIndex) => {
            const href = sourceHrefFor(file);
            const rowY = cursorY + 24 + readLineCount * 22;
            const label = `${fileIndex + 1}. ${shortPath(file.path)}`;
            const usedLines = wrapText(label, contentX, rowY, halfWidth - 24, {
              size: 14,
              lineHeight: 22,
              charWidth: 7.2,
              maxLines: 2,
              weight: 500,
              code: true,
              fill: href ? "#0b63b6" : "#3f4a55",
            });
            if (href) {
              const indicator = addText("↗", contentX + halfWidth - 8, rowY, {
                size: 15, weight: 700, anchor: "end", fill: "#0b63b6",
              });
              attachSourceLink(href, `${file.path}:${file.sourceLine || 1}`, contentX - 4, rowY - 17, halfWidth, Math.max(1, usedLines) * 22, indicator);
            }
            readLineCount += Math.max(1, usedLines);
          });
          const readHeight = 36 + readLineCount * 22;
          cursorY = columnStartY;
          const functionHeight = section("重点函数", readingList(functionItems), contentX + halfWidth + halfGap, halfWidth, 6, true);
          cursorY = columnStartY + Math.max(readHeight, functionHeight) + 8;

          cursorY += section(isRuntimeProbe ? "设计映射与不变量" : "核心对象", (module.objects || []).join(", "), contentX, contentWidth, 3, true);
          svg.appendChild(rc.line(contentX, cursorY - 6, contentX + contentWidth, cursorY - 6, {
            stroke: colorWithAlpha(color, 0.25),
            strokeWidth: 0.8,
            roughness: 0.35,
          }));
          addText(isRuntimeProbe ? "插桩前后运行时截面" : "模块内部主路径", contentX, cursorY + 18, { size: 17, weight: 650, display: true, fill: color });
          cursorY += 44;

          const parseRoute = (step, title) => {
            const prefix = String(step || "").match(/^(B\d+)\s+(.*)$/);
            const id = prefix ? prefix[1] : "B?";
            const rest = prefix ? prefix[2] : String(step || "");
            const arrowIndex = rest.indexOf(" -> ");
            const beforeArrow = arrowIndex >= 0 ? rest.slice(0, arrowIndex) : rest;
            const output = arrowIndex >= 0 ? rest.slice(arrowIndex + 4) : "UNCONFIRMED";
            const separator = beforeArrow.lastIndexOf(": ");
            return {
              id,
              title: title || "主路径步骤",
              owner: separator >= 0 ? beforeArrow.slice(0, separator) : beforeArrow,
              input: separator >= 0 ? beforeArrow.slice(separator + 2) : "UNCONFIRMED",
              output,
            };
          };

          (module.mainRoute || []).forEach((step, stepIndex) => {
            const route = parseRoute(step, (module.mainRouteTitles || [])[stepIndex]);
            const probeStep = (module.probeSteps || [])[stepIndex] || {};
            const routeSourceFile = isRuntimeProbe ? null : sourceFileForOwner(route.owner);
            const routeSourceHref = routeSourceFile ? sourceHrefFor(routeSourceFile) : "";
            if (stepIndex > 0) addText("↓", contentX + 22, cursorY - 7, { size: 18, weight: 500, fill: color });
            const routeY = cursorY + (stepIndex > 0 ? 5 : 0);
            const routeBox = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            routeBox.setAttribute("x", contentX);
            routeBox.setAttribute("y", routeY);
            routeBox.setAttribute("width", contentWidth);
            routeBox.setAttribute("height", isRuntimeProbe ? 198 : 134);
            routeBox.setAttribute("rx", 4);
            routeBox.setAttribute("fill", colorWithAlpha(color, 0.045));
            routeBox.setAttribute("stroke", colorWithAlpha(color, 0.32));
            routeBox.setAttribute("stroke-width", 0.8);
            svg.appendChild(routeBox);
            addText(`${route.id}  ${route.title}`, contentX + 16, routeY + 23, {
              size: 16,
              weight: 650,
              display: true,
              fill: "#26313d",
            });
            if (isRuntimeProbe) {
              addText("为什么测这里", contentX + 16, routeY + 48, { size: 13, weight: 600, fill: color });
            }
            wrapText(isRuntimeProbe ? (probeStep.whyHere || "PENDING") : route.owner, contentX + (isRuntimeProbe ? 112 : 16), routeY + 47, contentWidth - (isRuntimeProbe ? 128 : 32), {
              size: 14, lineHeight: 18, charWidth: 7.2, maxLines: 2,
              weight: 500, code: !isRuntimeProbe, fill: routeSourceHref ? "#0b63b6" : "#485563",
            });
            if (routeSourceHref) {
              const routeSourceArrow = addText("↗", contentX + contentWidth - 16, routeY + 47, {
                size: 15, weight: 700, anchor: "end", fill: "#0b63b6",
              });
              attachSourceLink(
                routeSourceHref,
                `${route.owner} -> ${routeSourceFile.path}:${routeSourceFile.sourceLine || 1}`,
                contentX + 8,
                routeY + 29,
                contentWidth - 16,
                44,
                routeSourceArrow,
              );
            }
            const routeColumnWidth = (contentWidth - 24) / 2;
            const boundaryY = routeY + (isRuntimeProbe ? 112 : 96);
            addText(isRuntimeProbe ? "插桩位置" : "input", contentX + 16, boundaryY, { size: 13, weight: 600, code: true, fill: color });
            wrapText(isRuntimeProbe ? (probeStep.location || "PENDING") : route.input, contentX + 88, boundaryY, routeColumnWidth - 72, {
              size: 14.5, lineHeight: 18, charWidth: 7.4, maxLines: 2,
              weight: 500, fill: isRuntimeProbe && probeStep.sourceHref ? "#0b63b6" : "#3f4a55",
            });
            if (isRuntimeProbe && probeStep.sourceHref) {
              const sourceArrow = addText("↗", contentX + routeColumnWidth - 16, boundaryY, {
                size: 15, weight: 700, fill: "#0b63b6",
              });
              attachSourceLink(
                probeStep.sourceHref,
                probeStep.location,
                contentX + 8,
                boundaryY - 18,
                routeColumnWidth - 8,
                44,
                sourceArrow,
              );
            }
            const outputX = contentX + routeColumnWidth + 24;
            addText(isRuntimeProbe ? "截获对象" : "output", outputX, boundaryY, { size: 13, weight: 600, code: true, fill: color });
            wrapText(isRuntimeProbe ? (probeStep.capture || "PENDING") : route.output, outputX + 88, boundaryY, routeColumnWidth - 88, {
              size: 14.5, lineHeight: 18, charWidth: 7.4, maxLines: 2,
              weight: 500, fill: "#3f4a55",
            });
            if (isRuntimeProbe) {
              addText("失败归属", contentX + 16, routeY + 166, { size: 13, weight: 600, fill: color });
              wrapText(probeStep.failureOwner || "PENDING", contentX + 88, routeY + 165, contentWidth - 104, {
                size: 14, lineHeight: 18, charWidth: 7.2, maxLines: 2,
                weight: 500, fill: "#8a3d2f",
              });
            }
            cursorY = routeY + (isRuntimeProbe ? runtimeProbeStepHeight : routeStepHeight);
          });
          return card;
      };

      runtimeModules.forEach((module, index) => {
        const cardX = left + index * columnWidth;
        renderModuleCard(module, cardX, top, `R${String(index + 1).padStart(2, "0")}`);
        if (index > 0) {
          const connectorY = top - 18;
          svg.appendChild(rc.line(cardX - 50, connectorY, cardX - 12, connectorY, {
            stroke: module.color || "#64748b", strokeWidth: 1.1, roughness: 0.35,
          }));
          addText("→", cardX - 36, connectorY + 5, { size: 16, weight: 500, fill: module.color || "#64748b" });
        }
      });

      addText("Supporting Boundaries", left, supportTop - 42, {
        size: 18, weight: 700, display: true, fill: "#26313d",
      });
      svg.appendChild(rc.line(left + 205, supportTop - 47, width - left, supportTop - 47, {
        stroke: "#c8c1b5", strokeWidth: 0.9, roughness: 0.35,
      }));
      supportModules.forEach((module, index) => {
        renderModuleCard(module, left + index * columnWidth, supportTop, `S${String(index + 1).padStart(2, "0")}`);
      });
    }

    let activeStageIndex = 0;
    function splitCalibrationStages(data) {
      if (Array.isArray(data.stages)) return data.stages;
      const isCalibrationFigure = data.layout === "method_figure"
        && (data.nodes || []).some((node) => node.id.startsWith("ICA4-S1-"));
      if (!isCalibrationFigure) return [data];
      const groups = [
        ["Stage 1 · Direction", "ICA4-S1-"],
        ["Stage 2 · Coefficient", "ICA4-S2-"],
        ["Stage 3 · Scale & Proof", "ICA4-S3-"],
        ["部署 · Unseen Conditions", "ICA4-D-"],
      ];
      return groups.map(([stageTitle, prefix]) => {
        const sourceNodes = (data.nodes || []).filter((node) => node.id.startsWith(prefix));
        const minX = Math.min(...sourceNodes.map((node) => node.x));
        const minY = Math.min(...sourceNodes.map((node) => node.y));
        const maxX = Math.max(...sourceNodes.map((node) => node.x + node.w));
        const maxY = Math.max(...sourceNodes.map((node) => node.y + node.h));
        const sourceWidth = Math.max(1, maxX - minX);
        const sourceHeight = Math.max(1, maxY - minY);
        const figureWidth = 1920;
        const figureHeight = 920;
        const scaleCap = prefix === "ICA4-S1-" ? 1 : 1.08;
        const scale = Math.min(scaleCap, (figureWidth - 160) / sourceWidth, (figureHeight - 160) / sourceHeight);
        const offsetX = (figureWidth - sourceWidth * scale) / 2 - minX * scale;
        const offsetY = (figureHeight - sourceHeight * scale) / 2 - minY * scale;
        const nodes = sourceNodes.map((node) => ({
          ...node,
          x: node.x * scale + offsetX,
          y: node.y * scale + offsetY,
          w: node.w * scale,
          h: node.h * scale,
          shapeInset: node.shapeInset ? node.shapeInset * scale : node.shapeInset,
          viewScale: scale,
        }));
        const ids = new Set(nodes.map((node) => node.id));
        return {
          ...data,
          title: stageTitle,
          figureWidth,
          figureHeight,
          layerDividers: [],
          nodes,
          viewScale: scale,
          edges: (data.edges || []).filter((edge) => ids.has(edge.from) && ids.has(edge.to)).map((edge) => ({
            ...edge,
            via: (edge.via || []).map(([x, y]) => [x * scale + offsetX, y * scale + offsetY]),
            labelX: edge.labelX == null ? edge.labelX : edge.labelX * scale + offsetX,
            labelY: edge.labelY == null ? edge.labelY : edge.labelY * scale + offsetY,
            labelSize: edge.labelSize ? edge.labelSize * scale : Math.max(13, 11 * scale),
            labelLineHeight: edge.labelLineHeight ? edge.labelLineHeight * scale : edge.labelLineHeight,
          })),
        };
      });
    }

    function renderStageTabs(data, stages) {
      const tabs = document.getElementById("stage-tabs");
      const showTabs = stages.length > 1;
      document.body.classList.toggle("has-stage-tabs", showTabs);
      tabs.replaceChildren();
      if (!showTabs) return;
      stages.forEach((stageData, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `stage-tab${index === activeStageIndex ? " active" : ""}`;
        button.textContent = stageData.title;
        button.addEventListener("click", () => {
          activeStageIndex = index;
          zoom = 1;
          autoFitWidth = true;
          stage.scrollLeft = 0;
          stage.scrollTop = 0;
          render(data);
        });
        tabs.appendChild(button);
      });
    }

    function render(data) {
      clearSvg();
      const stages = splitCalibrationStages(data);
      renderStageTabs(data, stages);
      data = stages[Math.min(activeStageIndex, stages.length - 1)] || stages[0];
      const moduleInspectorActive = Boolean(data.moduleInspector) && viewMode !== "repository_reading";
      title.textContent = moduleInspectorActive
        ? data.moduleInspector?.title || data.title || "MOSAIC Architecture Atlas"
        : data.title || "MOSAIC Architecture Atlas";
      const layout = data.layout || "tabs";
      if (layout === "code_quality_evidence_atlas") {
        renderCodeQualityEvidenceAtlas(data, {
          svg,
          rough,
          setCanvas,
          addText,
          wrapText,
          measuredLineCount,
          colorWithAlpha,
          rerender: () => render(data),
        });
      } else if (moduleInspectorActive) {
        renderModuleInspector(data, {
          svg,
          rough,
          setCanvas,
          addText,
          wrapText,
          colorWithAlpha,
          rerender: () => render(data),
        });
      } else if (layout === "repo_tree") {
        renderRepoTree(data);
      } else if (layout === "design_transaction_inspector" || layout === "module_test_inspector") {
        renderInspector(data);
      } else if (layout === "repository_reading_atlas") {
        renderRepositoryReadingAtlas(data);
      } else if (layout === "flow_tree") {
        renderFlowTree(data);
      } else if (layout === "method_figure") {
        renderMethodFigure(data);
      } else {
        renderTabs(data);
      }
      if (moduleInspectorActive && autoFitWidth) {
        requestAnimationFrame(() => {
          fitWidth();
          stage.scrollLeft = 0;
          stage.scrollTop = 0;
        });
      } else if ((layout === "repository_reading_atlas" || layout === "design_transaction_inspector" || layout === "module_test_inspector") && autoFitWidth) {
        autoFitWidth = false;
        zoom = clampZoom(data.defaultZoom || ((layout === "design_transaction_inspector" || layout === "module_test_inspector") ? 0.8 : 0.65));
        requestAnimationFrame(() => {
          applyZoom();
          stage.scrollLeft = 0;
          stage.scrollTop = 0;
        });
      } else if (autoFitWidth) {
        requestAnimationFrame(() => fitWidth());
      }
    }

    async function loadFromFile(force = false) {
      if (!force && document.activeElement === source && sourceDirty) return;
      const embeddedElement = document.getElementById("atlas-embedded-data");
      let data;
      if (embeddedElement) {
        data = JSON.parse(embeddedElement.textContent);
      } else {
        const response = await fetch(`${dataUrl}?t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        data = await response.json();
      }
      const serialized = JSON.stringify(data, null, 2);
      if (!force && serialized === lastServerData) return;
      lastServerData = serialized;
      sourceDirty = false;
      source.value = serialized;
      render(data);
      setStatus(`loaded ${new Date().toLocaleTimeString()}`);
      hint.innerHTML = data.moduleInspector && viewMode !== "repository_reading"
        ? `Module Inspector reads one owner registry from <code>${dataUrl.replace("./", "")}</code>. Select a module to highlight its Training Main Loop stage and inspect its function chain.`
        : `Edit <code>${dataUrl.replace("./", "")}</code> in VSCode. Hide this editor for full-width review. Drag the canvas to pan; use zoom controls or trackpad scroll for large maps.`;
    }

    function renderEditor() {
      try {
        const data = JSON.parse(source.value);
        render(data);
        setStatus(`rendered editor ${new Date().toLocaleTimeString()}`);
      } catch (error) {
        setStatus(`JSON error: ${error.message}`);
      }
    }

    reloadButton.addEventListener("click", () => loadFromFile(true).catch((error) => setStatus(error.message)));
    renderButton.addEventListener("click", renderEditor);
    toggleEditorButton.addEventListener("click", () => {
      layout.classList.toggle("editor-hidden");
      toggleEditorButton.textContent = layout.classList.contains("editor-hidden") ? "Show Editor" : "Hide Editor";
      requestAnimationFrame(() => {
        if (autoFitWidth) {
          fitWidth();
        } else {
          applyZoom();
        }
      });
    });
    zoomOutButton.addEventListener("click", () => setZoom(zoom / 1.18));
    zoomInButton.addEventListener("click", () => setZoom(zoom * 1.18));
    zoomFitButton.addEventListener("click", fitWidth);
    zoomResetButton.addEventListener("click", () => setZoom(1));
    stage.addEventListener("wheel", (event) => {
      if (!event.ctrlKey && !event.metaKey) return;
      event.preventDefault();
      const rect = stage.getBoundingClientRect();
      const anchor = {
        x: stage.scrollLeft + event.clientX - rect.left,
        y: stage.scrollTop + event.clientY - rect.top,
      };
      autoFitWidth = false;
      zoom = clampZoom(zoom * (event.deltaY > 0 ? 0.92 : 1.08));
      applyZoom(anchor);
    }, { passive: false });
    window.addEventListener("resize", () => {
      if (autoFitWidth) {
        requestAnimationFrame(() => fitWidth());
      }
    });
    stage.addEventListener("mousedown", (event) => {
      if (event.button !== 0 || event.target.closest("button, a, [data-source-link='true']")) return;
      isPanning = true;
      panStartX = event.clientX;
      panStartY = event.clientY;
      panScrollLeft = stage.scrollLeft;
      panScrollTop = stage.scrollTop;
      stage.classList.add("dragging");
    });
    window.addEventListener("mousemove", (event) => {
      if (!isPanning) return;
      stage.scrollLeft = panScrollLeft - (event.clientX - panStartX);
      stage.scrollTop = panScrollTop - (event.clientY - panStartY);
    });
    window.addEventListener("mouseup", () => {
      if (!isPanning) return;
      isPanning = false;
      stage.classList.remove("dragging");
    });
    source.addEventListener("input", () => {
      sourceDirty = true;
      window.clearTimeout(source._renderTimer);
      source._renderTimer = window.setTimeout(renderEditor, 250);
    });

    if (!document.getElementById("atlas-embedded-data") && "EventSource" in window) {
      const events = new EventSource("/events");
      events.addEventListener("architecture-data", () => {
        loadFromFile().catch((error) => setStatus(error.message));
      });
    }

    if (!document.getElementById("atlas-embedded-data")) {
      window.setInterval(() => {
        loadFromFile().catch(() => {});
      }, 1500);
    }

    loadFromFile(true).catch((error) => {
      source.value = JSON.stringify({ title: "MOSAIC Architecture Atlas", layout: "repo_tree", files: [] }, null, 2);
      renderEditor();
      setStatus(`open through serve_architecture.mjs: ${error.message}`);
    });
  </script>
</body>
