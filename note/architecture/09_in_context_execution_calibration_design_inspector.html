  <style>
    :root {
      --ink: #1f2933;

      --paper: #fbfaf4;

      --font-body: "Avenir Next", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
      --font-display: "Avenir Next", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
      --font-code: "JetBrains Mono", "SF Mono", "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      letter-spacing: 0;
    }

    .stage-tabs { display: flex; gap: 8px; padding: 12px 20px 0; background: var(--paper); }
    .stage-tabs:empty { display: none; }
    .stage-tab { border: 1px solid var(--line); border-radius: 8px 8px 0 0; background: var(--panel); color: var(--muted); padding: 10px 18px; font: 700 14px var(--font-body); cursor: pointer; }
    .stage-tab.active { color: var(--ink); background: #fff; border-color: #8b8174; box-shadow: 0 -2px 0 #2563eb inset; }

    .atlas-equation {
      align-items: center;
      box-sizing: border-box;
      color: #243140;
      display: flex;
      height: 100%;
      overflow: visible;
      width: 100%;
    }

    .atlas-equation .katex-display {
      margin: 0;
      text-align: left;
    }

    .atlas-equation-fallback {
      color: #9b3f32;
      font-family: var(--font-code);
      font-size: 15px;
      white-space: nowrap;
    }

    .atlas-detail-table {
      border-collapse: collapse;
      color: #34414e;
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.35;
      table-layout: fixed;
      width: 100%;
    }

    .atlas-detail-table th,
    .atlas-detail-table td {
      border: 1px solid rgba(86, 99, 112, 0.24);
      box-sizing: border-box;
      padding: 9px 12px;
      text-align: left;
      vertical-align: middle;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .atlas-detail-table th {
      background: rgba(255, 255, 255, 0.76);
      color: #26313d;
      font-weight: 720;
    }

    .atlas-detail-table tbody tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.42);
    }

    .atlas-detail-table th:first-child,
    .atlas-detail-table td:first-child {
      width: 21%;
    }

    .atlas-detail-table th:nth-child(2),
    .atlas-detail-table td:nth-child(2) {
      width: 59%;
    }

    .atlas-detail-table th:last-child,
    .atlas-detail-table td:last-child {
      width: 20%;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: #fffef9;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
      font-family: var(--font-display);
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .zoom-label {
      min-width: 48px;
      text-align: center;
      color: #3f4b59;
      font-variant-numeric: tabular-nums;
    }

    button {
      border: 1px solid #b9b1a2;
      background: #fff7df;
      color: var(--ink);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }

    main {
      display: grid;
      grid-template-columns: minmax(360px, 0.32fr) minmax(760px, 1fr);
      height: calc(100vh - 54px);
      min-height: 620px;
      overflow: hidden;
    }

    body.has-stage-tabs main {
      height: calc(100vh - 105px);
    }

    main.editor-hidden {
      grid-template-columns: minmax(0, 1fr);
    }

    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    main.editor-hidden aside {
      display: none;
    }

    .hint {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    textarea {
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      resize: none;
      border: 0;
      outline: 0;
      padding: 14px;
      background: #fffdf8;
      color: #222;
      font-family: var(--font-code);
      font-size: 12px;
      line-height: 1.45;
      tab-size: 2;
    }

    .stage {
      position: relative;
      overflow: auto;
      min-width: 0;
      background:
        linear-gradient(rgba(31, 41, 51, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 41, 51, 0.025) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      cursor: grab;
      overscroll-behavior: contain;
    }

    .stage.dragging {
      cursor: grabbing;
      user-select: none;
    }

    svg {
      display: block;
      width: 1520px;
      height: 980px;
      transform-origin: 0 0;
    }

    .status {
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 1040px) {
      main {
        grid-template-columns: 1fr;
        height: auto;
      }

      aside {
        height: 360px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>

  <script id="atlas-embedded-data" type="application/json">{"title":"In-Context Execution Calibration — Design Inspector","subtitle":"校准 = 真机系数 × 归一化修正算子：基由失败轨迹自监督 + SVD 在仿真发现（失配低维、隐空间可相加），识别后按类型定型为算子 Δᵢ(z)；真机只读标量、零训练；串行三阶段，禁联合训练","layout":"design_transaction_inspector","defaultZoom":0.8,"transaction":{"phaseTitles":{"pre":"准备与冻结","collection":"DR 采集与因果对标注","update":"串行三阶段构造与部署"},"steps":[{"id":"train-source-oracle","phase":"pre","label":"ICE-Cal 训练 Privileged Oracle","detail":"在单一 G1WalkFlat locomotion 任务内，用类型化特权观测和域随机化直接训练通用 privileged SAC Oracle；Command 是唯一模式权威：零指令使用站立支撑/稳定 Reward，非零指令使用行走跟踪 Reward；禁止 Gait/feet-phase Reward 与 gait constraint；同一次训练产生 20 个 intermediate checkpoints（240…4800）与 final checkpoint（5000），共享 oracle_lineage_id"},{"id":"distill-source","phase":"pre","label":"按 FADA 契约蒸馏 Planner–Tracker","detail":"Planner 历史 token 为 66 维本体状态 + 29 维 previous action，Command 3 维单独输入，并仅预测 action-free 的 K×66 future；20 个 intermediate checkpoints 只扩充 IDM 次优覆盖，final Oracle 为所有源域 rollout 提供 action 标签与 Oracle-shadow"},{"id":"sample-axis","phase":"pre","label":"DR 全域随机化采样（参数 θ 记录）","detail":"对动作通道增益/延迟/零偏与本体质量/质心/惯量/阻尼等参数同时采样（范围见 Perturbation Space 总表），逐次 rollout 记录采样向量 θ；θ 是主成分物理识别的对照表，对 Coefficient Encoder 不可见"},{"id":"freeze-source","phase":"pre","label":"冻结 Planner 与完整 Tracker","detail":"Planner、Tracker Encoder、Tracker Decoder 全程保持源 checkpoint；三个 Stage 均不更新它们"},{"id":"rollout-labeled","phase":"collection","label":"DR Rollout 记录因果对","detail":"联合失配下 rollout，逐步记录（history、实际发生的未来、实际执行的动作、θ）四元组；实际未来 × 执行动作构成逆动力学因果对，监督自给——无需特权标签、不经网络、不经 RL、无需逐因公式；初等公式（a*/g、提前 k 拍、a−b）降为单元测试"},{"id":"basis-identify","phase":"update","label":"载体回归 + SVD 提基 + 识别","detail":"逐样本求解 δz*（z_failed=Encoder(history, 实际未来)，min‖Dec(z_failed+δ)−a_exec‖，最小范数约定）；δz* 按指令幅度归一化后在通用载体库 {z, 常数1, 时移z} 上回归为“载体×矩阵”；对状态无关的矩阵做 SVD 提主成分（奇异值谱=低维性证据）；主成分强度 × θ 相关分析 + 单参数扫掠识别物理身份，识别不出的标记混合/未知，只参与残余监测"},{"id":"stage1-direction","phase":"update","label":"Stage 1：按类型定型算子 Δᵢ","detail":"每个已识别主成分按类型选定算子形式（乘性 M·z / 加性常数 b / 时移移位），拟合参数；诊断门：共享算子跨状态补偿比 ≥0.9（残余 ≤0.1），不过→加载体或扩基，禁止放宽阈值；Tracker 全冻结"},{"id":"freeze-direction","phase":"update","label":"算子冻结入库","detail":"Δᵢ 进入 Δzᵢ Optimization 成为架构常量，之后任何阶段不再更新；每个主成分一个算子，Coefficient Encoder 只能调标量系数"},{"id":"stage2-coefficient","phase":"update","label":"Stage 2：学系数 Encoder","detail":"算子冻结；c_true = δz* 在基上的投影系数；损失 ‖ĉ−c_true‖²+0.1·‖π(z+ΣĉᵢΔᵢ(z))−a*‖²（a* 由 δz* 经冻结 Decoder 自洽生成），梯度只进 Coefficient Encoder"},{"id":"freeze-encoder","phase":"update","label":"Encoder 学成即冻结","detail":"Coefficient Encoder 成为部署唯一新网络，只输出 m 个标量"},{"id":"stage3-scale","phase":"update","label":"Stage 3：离线拟合 σᵢ + 出证","detail":"不训练网络；逐成分扫描记录 (ĉ, 误差) 拟合 σᵢ；真机只 refit σ：对已识别成分绑物理仪表，残余读数归零为判据；出方向夹角/残差/恒等锚定/奇异值谱证据"},{"id":"deploy-readout","phase":"update","label":"部署：短读数 → 读系数 → 冻结执行","detail":"未见条件下取一次短读数；冻结 Encoder 读 c；z̄=z+Σσᵢ(cᵢ)·Δᵢ(z) 送入冻结 Tracker 执行；残余仪表盯梢，系统性残差触发扩基；零再训练"}]},"cards":[{"designId":"ICA-DP-01","blockId":"ICA-BACKBONE","title":"Frozen Backbone","color":"#6c4d91","responsibility":"按 FADA 源域契约训练并冻结的规划与执行主干：ICE-Cal 内训练 privileged Oracle，再以同一 Oracle lineage 蒸馏 Planner–Tracker；Planner 读取历史动作但只预测 action-free future，Tracker 生成六步 Action；校准只发生在 Tracker latent 一处修正。","details":[{"heading":"1. 源策略来自 ICE-Cal Privileged Oracle","text":"Oracle 在单一 G1WalkFlat locomotion 任务内由任务 Reward、类型化特权观测和域随机化直接训练；20 个 intermediate checkpoints 与 final checkpoint 必须来自同一次训练并共享 oracle_lineage_id。"},{"heading":"2. 禁止 Gait/feet-phase Reward","text":"Command 是 98 维可部署观测内的唯一模式权威，不新增 mode bit：零指令进入站立支撑/稳定 Reward，非零指令进入行走跟踪 Reward。步态相位可保留为观测，但 feet_phase、feet_phase_contrast、feet_phase_contact 与等价相位驱动奖励必须为 0 或缺省，gait constraint 必须关闭；预检发现越界即拒绝启动。"},{"heading":"3. Planner 看历史动作，但 future 不含动作","text":"原始 98 维输入拆成 66 维本体状态、29 维 previous action 和 3 维 Command；Planner 历史 token 为 95 维，Command 单独输入，只预测 K×66 的 action-free future，避免 future 泄露待监督动作。"},{"heading":"4. IDM 使用因果 future–action 配对","text":"IDM 输入 H×66 状态历史、H×29 动作历史和 K×66 action-free future，输出 K×29 Action；20 个 intermediate checkpoints 只用于扩充 IDM 的次优轨迹覆盖，final Oracle 为所有源域 rollout 提供动作标签。"},{"heading":"5. Planner 只输出目标未来","text":"Planner 以 6 帧未来本体观测序列描述机器人应该怎样运动；具体 Action 仍由 Tracker 生成。"},{"heading":"6. 校准不接管 Planner Intent","text":"校准只调整当前 Intent 的执行方式，不能修改 Command 所定义的任务目标；Planner Intent 可随当前 State History 动态变化。"},{"heading":"7. 训练 Rollout 记录当次 Planner 输出","text":"轨迹直接保存当时交给 Tracker 的目标未来序列，不需要额外提供预先保存的 clean rollout。"},{"heading":"8. Tracker Decoder 从标定 latent 输出六步 Action","text":"Tracker latent z 是 K=6 个 future token、每个 D=128 维；标定算子作用在 action_head 之前：z̄=z+Σσᵢ(cᵢ)·Δᵢ(z)，Decoder 从 z̄ 解码完整 6 步 Action chunk；校准只发生在这一处 latent 修正。","latex":"\\bar z = z + \\sum_i \\sigma_i(c_i)\\,\\Delta_i(z)"},{"heading":"9. Receding-Horizon 只执行第一步","text":"每个控制周期只发送 Action chunk 的第一步，随后更新历史并重新规划。"},{"heading":"10. 全程冻结，Tracker 是唯一 Action 生成器","text":"三个 Stage 与部署中 Planner 与 Tracker 参数都不更新，避免 Tracker 直接记住各种缺陷；校准链路只提供低维 latent 位移，不能绕开 Decoder 直接输出 Action。"}],"highlightSteps":["train-source-oracle","distill-source","freeze-source","rollout-labeled","stage1-direction","deploy-readout"],"chips":[]},{"designId":"ICA-DP-02","blockId":"ICA-PERTURB","title":"Perturbation Space","color":"#ad6b3d","responsibility":"枚举可随机化的失配参数作为 DR 采样空间与识别对照表，而不是世界清单；基由数据驱动发现，枚举只为生成与解释数据。","details":[{"heading":"1. 轴是工具不是目标","text":"枚举参数只为 DR 采样与事后识别服务，不声称覆盖所有物理故障；第一批采样空间为增益/延迟/零位偏差（动作通道），本体动力学参数全域随机化以暴露慢签名成分；active_axes 语义改为已识别主成分的子集，m=len(active_axes)。"},{"heading":"2. 从逐轴解析标签 → 失败轨迹自监督 + 投影","text":"旧设计逐轴注入、用 α_true 初等公式算 a*；新设计 DR 联合采样、以失败轨迹的因果对（实际未来 → 执行动作）自监督，逐样本解出 δz*，c_true 为 δz* 在主成分基上的投影系数——不再要求每个原因有手工解析公式。初等公式保留为单元测试；组合条件留出验证。","latex":["a^{*}=a_{\\mathrm{nominal}}/g","a^{*}_{t}=a_{\\mathrm{nominal},\\,t+k}","a^{*}=a_{\\mathrm{nominal}}-b"]},{"heading":"3. 原因总表 · A 类：动作→执行通道（主战场）","text":"失真发生在发出的动作与实际执行之间；此类是校准主战场，全部进入 DR 采样空间（动作通道）。","table":{"columns":["原因","参数 / 文献先例 / a* 可解析性","批次建议"],"rows":[["A1 增益 / 电机强度","g（全局或逐关节）；RMA [0.9,1.1]×12维、SplitAdapter U(0.9,1.1)；✅ a*/g","第一批"],["A2 零位偏差","b（rad）；SplitAdapter U(−0.05,0.05)；✅ a−b","第一批"],["A3 动作延迟","k（帧）；文献空白，Hwangbo actuator net 隐式建模；✅ 提前 k 拍","第一批"],["A4 PD 增益失配","Kp/Kd；RMA Kp[50,60]、Kd[0.4,0.8]、SplitAdapter U(0.9,1.1)；🟡 一阶近似为有效增益","不单独立轴：作为 gain 轴成因之一（不可分辨即不用分辨）"],["A5 死区","dz 阈值；工业常见、文献少；✅ a+sign(a)·dz","第二批"],["A6 饱和 / 限幅","a_max；执行器普遍存在；✅ 量程内无需补偿，量程外属边界","第二批（兼边界声明）"],["A7 齿隙 backlash","方向翻转死程；文献少；🟡 翻转时一阶补偿","第三批"],["A8 执行器带宽 / slew rate","响应速率上限；Hwangbo actuator net 隐式；🟡 等效一阶低通 ≈ 延迟+增益","第三批"]]}},{"heading":"4. 原因总表 · B 类：本体动力学参数","text":"机器自身物理参数失配；失败轨迹自监督不区分成因、不再硬性排除：作为 DR 参数参与采样以暴露主成分，但 0.6 s 窗口读不出慢签名的能否部署由识别与读数门决定。","table":{"columns":["原因","参数 / 文献先例 / a* 可解析性","批次建议"],"rows":[["B1 载荷 / 质量","payload、link mass；RMA [0,6]kg、SplitAdapter U(0.8,1.2)；❌ 逆动力学","显式边界或雅可比一阶化后入库"],["B2 质心偏移","CoM；RMA [−0.15,0.15]、SplitAdapter U(−0.1,0.1)m；❌","同 B1"],["B3 关节阻尼 / 电枢","damping、armature；Isaac 系 DR 常见；🟡 等效速度增益","第三批"],["B4 惯量失配","I；文献少枚举；❌","显式边界"]]}},{"heading":"5. 原因总表 · C 类：接触与地面","text":"接触力学失真，文献枚举最多但超出执行校准范围，全部显式声明为边界。","table":{"columns":["原因","参数 / 文献先例 / a* 可解析性","批次建议"],"rows":[["C1 摩擦系数","μ；RMA [0.05,4.5]、Lee 𝒩(0.7,0.2)、SplitAdapter U(0.5,2.0)；❌ 接触力学","显式边界（已声明）"],["C2 恢复系数","e；SplitAdapter U(0.05,0.2)；❌","显式边界"],["C3 地形几何","高度/台阶/粗糙度；RMA 地形高度、Lee 全表；❌","边界（不属执行校准）"],["C4 接触模式切换 / 跌倒","—；❌","永久边界（已声明）"]]}},{"heading":"6. 原因总表 · D/E 类：外部扰动与观测通道","text":"D 类可等效为短时/持续 offset 留作候选；E 类属感知与 Tracker 训练职责，不是 ICE-Cal 的校准对象。","table":{"columns":["原因","参数 / 文献先例 / a* 可解析性","批次建议"],"rows":[["D1 外力 / 推搡","F（幅值/方向/时机）；SplitAdapter 每8步 [−50,50]N、Lee privileged 3维；🟡 脉冲等效短时 offset","第三批"],["D2 持续偏置力 / 风","F_const；部分 DR 工作；🟡 等效 offset","第三批"],["E1 观测噪声","各传感器 σ；SplitAdapter 全表；—","不枚举（Tracker 训练职责）"],["E2 传感器偏置","IMU/编码器 bias；部分工作；✅ 观测侧减除","不枚举（属感知校准）"],["E3 观测延迟 / 丢包","k / p_drop；部分工作；—","不枚举"]]}},{"heading":"7. 原因总表 · F 类：任务/物体参数（按需启用）","text":"manipulation 任务特有变量；正式实验若含搬运再议，当前不入库。","table":{"columns":["原因","参数 / 文献先例 / a* 可解析性","批次建议"],"rows":[["F1 物体质量","box mass；SplitAdapter [0.5,5.0]kg；❌","若做搬运任务再议"],["F2 物体摩擦 / 恢复","μ、e；SplitAdapter；❌","同 F1"],["F3 物体几何 / 拾放高度","尺寸、高度；SplitAdapter；—","任务变量，非失真"]]}}],"highlightSteps":["sample-axis","rollout-labeled","basis-identify"],"chips":[]},{"designId":"ICA-DP-03","blockId":"ICA-BASIS","title":"Basis Discovery","color":"#8c6d1f","responsibility":"从 DR 失败轨迹中发现修正子空间的基并赋予物理身份：因果对自监督 → 逐样本 latent 求解 → 载体回归 → SVD → 识别，替代手工逐因设计。","details":[{"heading":"1. 全域 DR + 参数记录","text":"采样空间内全部参数同时随机化并逐次记录 θ；多样性在仿真里免费，真机不具备此条件（单台机器无故障多样性），因此基只能在仿真里出生。rollout 覆盖全部动作族（直线/转身/侧移等），基只对采到的动作分布负责，跨动作有效性由 held-out 动作族复测背书。"},{"heading":"2. 失败轨迹即监督，逐样本解 δz*","text":"冻结 Planner+Tracker 在故障 θ 下 rollout，逐步记录（history、实际发生的未来、执行的动作、θ）因果四元组。以实际未来为 Encoder 输入得 z_failed，逐样本求解 δz*：使 Decoder(z_failed+δz) 复现实际执行的动作——输入是实际未来时该目标非自洽，残差即故障指纹；从 δ=0 出发取最小范数解。无需逆动力学、无需逐因解析公式；初等公式（a*/g、提前 k 拍、a−b）降为单元测试，FADA 式权重微调降为上界对照。","latex":"\\delta z^{*}=\\arg\\min_{\\delta}\\,\\lVert \\mathrm{Dec}(z_{\\mathrm{failed}}+\\delta)-a_{\\mathrm{exec}}\\rVert^{2}"},{"heading":"3. 载体回归 + SVD 提基","text":"δz* 样本按指令幅度归一化后在通用载体库 {z, 常数1, 时移z} 上回归为\"载体×矩阵\"；SVD 作用在状态无关的矩阵上，避免在向量上做 PCA 导致的状态依赖泄漏；奇异值谱是\"执行失配低维\"这一中心 claim 的核心图。"},{"heading":"4. 物理识别四步","text":"① 主成分强度 × θ 相关表（|r|≈1 定位参数）；② 单参数扫掠确认因果与量程；③ 载体/矩阵结构旁证；④ 绑物理仪表进入 σ 标定。识别不出的成分标混合/未知，只参与残余监测。"},{"heading":"5. 残余扩基（运维生长）","text":"部署后残余仪表持续监测；系统性残差在真机积累数据做 PCA，发现新成分则扩基并仅 refit σ；新成分的系数由同一残余仪表逐窗口投影直读——发现它的仪表天然能读它，不扩 Coefficient Encoder、不要求物理仪表。基在仿真里出生，在真机上生长。"}],"highlightSteps":["rollout-labeled","basis-identify","stage1-direction"],"chips":[]},{"designId":"ICA-DP-04","blockId":"ICA-DELTAZI","title":"Δzᵢ Optimization","color":"#7b5b8e","responsibility":"存放数据驱动发现、识别后按类型定型的 latent 修正算子库，承载执行失配的主要响应成分；每个成分只暴露一个标量系数。","details":[{"heading":"1. 方向与系数严格分离","text":"每个成分 Δᵢ 是冻结算子，按识别类型选定形式：乘性 M·z（增益类）、加性常数 b（零偏类）、时移移位（延迟类：k 由识别定为常量，Δ(z)=shift_k(z)−z，c 缩放移位强度）；整条成分只由一个标量系数 cᵢ 控制强度，Coefficient Encoder 不能重新生成方向或算子。","latex":"\\bar z = z + \\sum_i \\sigma_i(c_i)\\,\\Delta_i(z)"},{"heading":"2. 基由数据驱动发现","text":"DR 联合 rollout → 失败轨迹因果对自监督 + 逐样本 latent 求解 → 载体库回归 → 矩阵 SVD 提主成分（见 Basis Discovery）。v1 每轴一条固定向量 Δzᵢ 在 gain 轴诊断失败（共享向量跨状态补偿比 0.81<0.9）：固定向量给的是状态无关修正，gain 补偿必须随指令缩放——状态依赖必须由载体/算子承载。"},{"heading":"3. 识别后按类型定型","text":"每个主成分经相关表 + 单参数扫掠识别物理身份，归入乘性/加性/时移类型后用对应算子参数化并拟合；识别不出的成分标记混合/未知，只参与残余监测，不进可标定库。"},{"heading":"4. 零系数保持标称行为","text":"所有 cᵢ=0 时，校准路径必须退化为原始冻结 Tracker 的标称执行。"},{"heading":"5. 归一化与入库门","text":"每个成分入库前归一化，使 c=1 对应可比的满刻度修正强度（σ 标定与组合读数的前提）；入库门：共享算子跨状态补偿比 ≥0.9，不达标加载体或扩基，禁止放宽阈值。S1 另需在 held-out 动作族上复测，防止基只对提基动作分布负责。"}],"highlightSteps":["basis-identify","stage1-direction","freeze-direction"],"chips":[]},{"designId":"ICA-DP-05","blockId":"ICA-COEF-ENCODER","title":"Coefficient Encoder","color":"#3c7485","responsibility":"唯一新网络；从短读数读出各成分算子的标量系数 ĉ=(c₁…cₘ)，c=0 等价标称。","details":[{"heading":"1. Encoder 不预测动作","text":"它只读本次 active 主成分对应的 m 个系数，不输出 Action，也不重写 Tracker 的内部状态。"},{"heading":"2. 输入窗口与 Tracker 同缓冲","text":"输入是 30 帧 State/Action history，与 Tracker 维护的同一份部署缓冲；零额外传感成本，'输入同 Stage 1' 的图面承诺自然兑现。30 帧约 0.6 s，足以暴露增益 / 零偏 / 延迟的执行响应签名。"},{"heading":"3. 结构：小 Transformer encoder","text":"2 层 Transformer Encoder、d_model=128、mean-pool 后接 Linear 输出 m=len(active_axes) 个标量；与 Tracker 同族。注意力是时移成分的结构性需求：读出时移 k 需要在窗口内做任意位置对任意位置的匹配（第 t-k 帧指令 vs 第 t 帧响应），固定感受野结构没有这条通道。TConv 候选经评审砍除，不留消融基线。","latex":"\\hat c = W\\,\\mathrm{meanpool}\\big(\\mathrm{TFEnc}_{2\\times 128}(H_{30})\\big) \\in \\mathbb{R}^{m}"},{"heading":"4. 输出语义：补偿器而非辨识器","text":"输入形式与 RMA / SplitAdapter 的 history 输入对齐，差异化在输出语义：他们输出世界描述（辨识器），本 Encoder 输出冻结算子上的系数（补偿器）；部署输入就是滚动 30 帧窗口的瞬时读数，不承载采样信息，也不含真值标签。"},{"heading":"5. 输出无截断，超量程显式报警","text":"ĉ 不加 clamp：读数超出 σ 扫描量程时触发'该轴量程外'警告并降级该轴，不静默截断——clamp 会把'不知道'伪装成'知道'。"},{"heading":"6. 系数提供审计读数","text":"读出系数可直接与注入强度逐轴对照，异常时可见。"},{"heading":"7. c=0 回退标称","text":"无失配时 ĉ≈0，组合修正恒等，标称路径不受损。"},{"heading":"8. 系数相加限定于一阶校准区","text":"组合仅承诺在训练覆盖的强度范围内做线性叠加，跨区外推不做语义保证。"},{"heading":"9. 训练：串行更新唯一对象","text":"Stage 2 一次只训练本 Encoder，Planner、Tracker、算子、σ 全部冻结，禁止梯度越界与联合训练；系数训练与提基共用同一份 DR labeled rollouts（θ 与逐样本解 δz* 已知），零额外采集；冻结后实测确认性能不退化再放行下一阶段。"},{"heading":"10. 损失分工：系数锚定，动作做安全网","text":"主监督是系数项（ĉ 的含义归真值管）；动作项只做 λ=0.1 的一致性安全网。若动作项主导，梯度穿过冻结的 π/Δᵢ/σ 会逼 Encoder 报假数吸收下游误差：审计语义死、组合性死、σ 现场重测的零重训承诺死。真解处两项本就一致（S1/S3 已用 c_true 认证过动作通路），放大动作项买不到信号只买到风险。评价指标仍是动作误差。全方法只调 λ 这一个超参，{0, 0.1} 一次消融定生死。其中 a* 由逐样本解 δz* 经冻结 Decoder 自洽生成，无需外部动作标签。","latex":"L = \\|\\hat c - c_{true}\\|^2 + 0.1\\,\\|\\pi(z + \\textstyle\\sum_i \\hat c_i\\,\\Delta_i(z)) - a^*\\|^2"},{"heading":"11. 收敛判据 S2：读数误差 ≤0.05","text":"验证网格上 |ĉ−c_true| ≤0.05（归一化）。达不到 = 窗口信息不足以读该成分，加长窗口或砍成分。"}],"highlightSteps":["stage2-coefficient","freeze-encoder","deploy-readout"],"chips":[]},{"designId":"ICA-DP-06","blockId":"ICA-SIGMA","title":"σᵢ Calibration","color":"#b17845","responsibility":"把每个标量系数读数换算为对应方向的实际 latent 位移，并将方向强度标定为可检查的一维关系。","details":[{"heading":"1. σ 是离线换算","text":"扫描拟合把系数换算成方向强度，不触发训练，Encoder 结构与语义保持不变。"},{"heading":"2. 扫描网格","text":"归一化 c∈[−1,+1]、21 点（步长 0.1），每点 32 条 rollout 取平均动作误差；c=±1 对应训练覆盖的最大强度。m 条 active axes 共 m×21 个点，每点 32 条 rollout；单轴链路只需 21×32，完整三轴仍为 63×32。"},{"heading":"3. 拟合族：单调分段线性（PCHIP）","text":"修正强度必须随读数单调——非单调意味着同轴两个故障强度共用一个修正，语义即坏；单调约束比拟合精度更要紧。纯线性是 PCHIP 特例，接近线性的轴自然长成直线，不预设。"},{"heading":"4. 端点行为：饱和 + 报警，不外推","text":"|ĉ|>1 时 σ 在端点饱和并触发量程外报警：读数不截断（审计可见真实读数）、映射不外推（曲线只在扫描范围内保证）、报警显式——与 DP-05 无截断条款咬合，三件事各归各位。"},{"heading":"5. 真机重测协议：已知软故障当校准基准","text":"第一批成分全在指令通路上、软件可注入：真机上故意施加已知故障网格（指令缩放/延迟/偏置），c_true 依然免费，逐点实测最优修正强度，重画 σ——零训练。识别结果决定绑哪块物理仪表（增益→电流/力矩、零偏→编码器静态读数、延迟→指令-响应滞后），判据为补偿后残余读数归零；识别不出的成分不进真机标定。角色分工：未知真故障是测量对象（滚动窗口真机读数），已知软故障是校准基准；用未知故障当基准是循环论证。即使 Encoder 真机读数有系统偏差，只要单调，σ 重画会把偏差吸收进刻度——sim-to-real gap 有一个一维、可现场重画的容器承接。"},{"heading":"6. 组合靠系数相加","text":"σᵢ 只负责把各自的读数换成强度，跨轴组合由系数相加承担。"},{"heading":"7. 收敛判据 S3：R² ≥0.95 且单调","text":"σ 拟合优度 R²≥0.95 且曲线单调。达不到 = 该轴 σ 证据存疑。阈值均为工程起点，证据出来后可收紧，不是理论承诺。"}],"highlightSteps":["stage3-scale"],"chips":[]},{"designId":"ICA-DP-07","blockId":"ICA-DEPLOY","title":"Deployment","color":"#437f86","responsibility":"部署链：未见条件下一次短读数读出系数，沿冻结算子有界小拧 z，由冻结 Tracker 执行；全程零再训练。","details":[{"heading":"1. 未见条件直接进入","text":"新机器或新失真（含未枚举组合）出现时，不做任何参数更新。"},{"heading":"2. 短读数读系数","text":"一次短读数进入冻结 Coefficient Encoder，读出 c=(c₁…cₘ)。"},{"heading":"3. 查曲线换算成 latent 位移","text":"每个系数查 σᵢ 换算成该成分的实际强度，沿冻结算子施加修正。","latex":"\\bar z=z+\\sum_i\\sigma_i(c_i)\\,\\Delta_i(z)"},{"heading":"4. 冻结 Tracker 执行","text":"冻结 Tracker Decoder 从 z̄ 输出 6 步 Action；receding-horizon 只执行第一步。"},{"heading":"5. 全链路冻结","text":"Planner、Tracker、Coefficient Encoder、方向库、标定曲线全部冻结，只做推理，不进行在线参数更新。"},{"heading":"6. 与 FADA 的分界","text":"FADA 部署侧需采集目标域 rollout 并 LoRA 微调 IDM 权重（每个新条件一次训练）；本链部署零更新：0.6 s 读数读出系数即执行。其 LoRA 优于全量微调的结果是“执行失配低维”的外部旁证；本设计的奇异值谱与 held-out 组合是直接证据。"},{"heading":"7. 逐步读数，冷启动 c=0","text":"每个控制步读一次 ĉ 并立即应用（Encoder 仅 2 层 d=128，50Hz 开销可忽略）；部署前 30 帧窗口未满时 c=0 走标称执行，与'c=0 ≡ 标称'锚点一致，零特殊逻辑。"},{"heading":"8. 读数突变 = 显式事件","text":"相邻读数跳变超阈值时触发'快速失效'报警并冻结该轴读数，交给显式边界处理——D 类突发失效（抓握脱落等）的落地机制；轴只承接慢变执行通道失真。"},{"heading":"9. 组合留出是主图证据","text":"单轴有效不等于组合有效；held-out A+B 组合的恢复执行是主图证据，检查响应是否接近系数相加的预测。"},{"heading":"10. 残余盯梢与扩基入口","text":"执行中残余仪表持续监测；超出基张成范围的系统性残差触发扩基流程（真机数据 PCA → 新成分 → 仅 refit σ），不静默硬拧。"}],"highlightSteps":["freeze-encoder","deploy-readout"],"chips":[]}]}</script>
  <script>

    const params = new URLSearchParams(window.location.search);
    const dataUrl = params.get("data") || "../../concept/03_frontres_concept_tabs.data.json";
    const viewMode = params.get("view") || "";
    const source = document.getElementById("source");
    const status = document.getElementById("status");
    const svg = document.getElementById("diagram");
    const reloadButton = document.getElementById("reload");
    const renderButton = document.getElementById("render");
    const toggleEditorButton = document.getElementById("toggle-editor");
    const zoomOutButton = document.getElementById("zoom-out");
    const zoomInButton = document.getElementById("zoom-in");
    const zoomFitButton = document.getElementById("zoom-fit");
    const zoomResetButton = document.getElementById("zoom-reset");
    const zoomLabel = document.getElementById("zoom-label");
    const layout = document.getElementById("layout");
    const stage = document.getElementById("stage");
    const title = document.getElementById("page-title");
    const hint = document.getElementById("hint");
    let lastServerData = null;
    let sourceDirty = false;
    let canvasWidth = 1520;
    let canvasHeight = 980;
    let zoom = 1;
    let autoFitWidth = true;
    let activeInspectorCardId = null;
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let panScrollLeft = 0;
    let panScrollTop = 0;

    function setStatus(text) {
      status.textContent = text;
    }

    function clearSvg() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
    }

    function setCanvas(width, height) {
      canvasWidth = width;
      canvasHeight = height;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      applyZoom();
    }

    function clampZoom(value) {
      return Math.max(0.25, Math.min(2.8, value));
    }

    function applyZoom(anchor = null) {
      const oldWidth = Number.parseFloat(svg.style.width) || canvasWidth;
      const oldHeight = Number.parseFloat(svg.style.height) || canvasHeight;
      const nextWidth = canvasWidth * zoom;
      const nextHeight = canvasHeight * zoom;
      const centerX = anchor?.x ?? stage.scrollLeft + stage.clientWidth / 2;
      const centerY = anchor?.y ?? stage.scrollTop + stage.clientHeight / 2;
      const ratioX = oldWidth > 0 ? centerX / oldWidth : 0;
      const ratioY = oldHeight > 0 ? centerY / oldHeight : 0;
      svg.style.width = `${nextWidth}px`;
      svg.style.height = `${nextHeight}px`;
      zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
      requestAnimationFrame(() => {
        stage.scrollLeft = Math.max(0, nextWidth * ratioX - stage.clientWidth / 2);
        stage.scrollTop = Math.max(0, nextHeight * ratioY - stage.clientHeight / 2);
      });
    }

    function setZoom(nextZoom, options = {}) {
      if (!options.keepAutoFit) {
        autoFitWidth = false;
      }
      zoom = clampZoom(nextZoom);
      applyZoom();
    }

    function fitWidth() {
      autoFitWidth = true;
      const padding = 48;
      const available = Math.max(320, stage.clientWidth - padding);
      zoom = clampZoom(available / canvasWidth);
      applyZoom();
    }

    function addText(text, x, y, options = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "text");
      el.setAttribute("x", x);
      el.setAttribute("y", y);
      el.setAttribute("fill", options.fill || "#1f2933");
      el.setAttribute("font-size", options.size || 18);
      el.setAttribute("font-weight", options.weight || 500);
      const bodyFont = '"Avenir Next", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif';
      const displayFont = '"Avenir Next", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif';
      const codeFont = '"JetBrains Mono", "SF Mono", "SFMono-Regular", Menlo, Monaco, Consolas, monospace';
      el.setAttribute("font-family", options.family || (options.code ? codeFont : (options.display || (options.weight || 500) >= 650 ? displayFont : bodyFont)));
      el.setAttribute("letter-spacing", "0");
      if (options.anchor) el.setAttribute("text-anchor", options.anchor);
      el.textContent = text;
      svg.appendChild(el);
      return el;
    }

    function addLatex(latex, x, y, width, options = {}) {
      const height = options.height || 42;
      const foreignObject = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
      foreignObject.setAttribute("x", x);
      foreignObject.setAttribute("y", y);
      foreignObject.setAttribute("width", width);
      foreignObject.setAttribute("height", height);

      const container = document.createElementNS("http://www.w3.org/1999/xhtml", "div");
      container.setAttribute("class", "atlas-equation");
      container.style.fontSize = `${options.size || 18}px`;
      try {
        katex.render(latex, container, {
          displayMode: true,
          strict: false,
          throwOnError: true,
        });
      } catch (error) {
        console.error(`[Atlas LaTeX] ${error.message}`, { latex });
        container.setAttribute("class", "atlas-equation atlas-equation-fallback");
        container.textContent = latex;
      }
      foreignObject.appendChild(container);
      svg.appendChild(foreignObject);
      return foreignObject;
    }

    function addDetailTable(tableData, x, y, width, height) {
      const foreignObject = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
      foreignObject.setAttribute("x", x);
      foreignObject.setAttribute("y", y);
      foreignObject.setAttribute("width", width);
      foreignObject.setAttribute("height", height);

      const table = document.createElementNS("http://www.w3.org/1999/xhtml", "table");
      table.setAttribute("class", "atlas-detail-table");
      const head = document.createElementNS("http://www.w3.org/1999/xhtml", "thead");
      const headRow = document.createElementNS("http://www.w3.org/1999/xhtml", "tr");
      (tableData.columns || []).forEach((label) => {
        const cell = document.createElementNS("http://www.w3.org/1999/xhtml", "th");
        cell.textContent = label;
        headRow.appendChild(cell);
      });
      head.appendChild(headRow);
      table.appendChild(head);

      const body = document.createElementNS("http://www.w3.org/1999/xhtml", "tbody");
      (tableData.rows || []).forEach((row) => {
        const rowElement = document.createElementNS("http://www.w3.org/1999/xhtml", "tr");
        row.forEach((value) => {
          const cell = document.createElementNS("http://www.w3.org/1999/xhtml", "td");
          cell.textContent = value;
          rowElement.appendChild(cell);
        });
        body.appendChild(rowElement);
      });
      table.appendChild(body);
      foreignObject.appendChild(table);
      svg.appendChild(foreignObject);
      return foreignObject;
    }

    function textUnits(text) {
      return Array.from(String(text || "")).reduce((sum, ch) => (
        sum + (/[\u3400-\u9fff\uff00-\uffef]/.test(ch) ? 1.85 : 1)
      ), 0);
    }

    function splitLongWord(word, maxUnits) {
      if (textUnits(word) <= maxUnits) return [word];
      const chunks = [];
      let chunk = "";
      for (const ch of Array.from(word)) {
        if (chunk && textUnits(chunk + ch) > maxUnits) {
          chunks.push(chunk);
          chunk = ch;
        } else {
          chunk += ch;
        }
      }
      if (chunk) chunks.push(chunk);
      return chunks;
    }

    function wrappedLines(text, width, options = {}) {
      const charWidth = options.charWidth || 7;
      const maxUnits = Math.max(8, Math.floor(width / charWidth));
      const tokens = String(text || "")
        .replace(/\s+/g, " ")
        .trim()
        .split(" ")
        .flatMap((word) => splitLongWord(word, maxUnits));
      const lines = [];
      let line = "";
      for (const token of tokens) {
        const needsSpace = line && /[A-Za-z0-9)]$/.test(line) && /^[A-Za-z0-9(]/.test(token);
        const probe = line ? `${line}${needsSpace ? " " : ""}${token}` : token;
        if (textUnits(probe) > maxUnits && line) {
          lines.push(line);
          line = token;
        } else {
          line = probe;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function measuredLineCount(text, width, options = {}) {
      const lines = wrappedLines(text, width, options);
      if (!lines.length) return 1;
      return options.maxLines ? Math.min(lines.length, options.maxLines) : lines.length;
    }

    function estimatedTextWidth(text, options = {}) {
      return textUnits(text) * (options.charWidth || 7);
    }

    function wrapText(text, x, y, width, options = {}) {
      const lines = wrappedLines(text, width, options);
      const rendered = lines.slice(0, options.maxLines || lines.length);
      rendered.forEach((ln, idx) => {
        addText(ln, x, y + idx * (options.lineHeight || 18), {
          size: options.size || 13,
          fill: options.fill || "#364250",
          weight: options.weight || 500,
          code: options.code,
          display: options.display,
          family: options.family,
          anchor: options.anchor,
        });
      });
      return rendered.length;
    }

    function wrapMultilineText(text, x, y, width, options = {}) {
      const maxLines = options.maxLines || Number.POSITIVE_INFINITY;
      const lineHeight = options.lineHeight || 18;
      let count = 0;
      for (const paragraph of String(text || "").split("\n")) {
        const lines = wrappedLines(paragraph, width, options);
        for (const line of lines) {
          if (count >= maxLines) return count;
          addText(line, x, y + count * lineHeight, {
            size: options.size || 13,
            fill: options.fill || "#364250",
            weight: options.weight || 500,
            code: options.code,
            display: options.display,
            family: options.family,
          });
          count += 1;
        }
      }
      return count;
    }

    function colorWithAlpha(hex, alpha) {
      const clean = String(hex || "#6688aa").replace("#", "");
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function flattenFlow(nodes, depth = 0, parent = null, rows = []) {
